<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly 3D Manevi Ağaç Simülasyonu</title>
    <style>
        :root {
            --primary: #059669;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #171f38 50%, #032d22 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 3D Sahne Alanı */
        .scene-container {
            width: 100%;
            height: 340px;
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
        }

        .isometric-world {
            width: 340px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(50deg) rotateZ(-45deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .world-base {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #854d0e;
            border-radius: 12px;
            box-shadow: -25px 25px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
            transition: background 0.8s ease;
        }

        .world-base.active-island {
            background: #15803d;
        }

        /* Low-Poly 3D Ağaç Konteyneri */
        .tree-3d-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(15px);
            width: 160px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        svg.low-poly-tree {
            width: 140px;
            height: 160px;
            filter: drop-shadow(8px 14px 18px rgba(0,0,0,0.7));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tree-pop {
            animation: treeAnim 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes treeAnim {
            0% { transform: scale(0.6) translateZ(10px); opacity: 0.5; }
            70% { transform: scale(1.15) translateZ(50px); opacity: 1; }
            100% { transform: scale(1) translateZ(30px); opacity: 1; }
        }

        .tree-label {
            position: absolute;
            bottom: -10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: #6ee7b7;
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            transform: translateZ(35px);
        }

        .quote-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            text-align: center;
            font-style: italic;
            color: #34d399;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* Takvim Paneli */
        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
        .drawer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .drawer.open { max-height: 160px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 110px; overflow-y: auto; }
        .day-cell { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px; text-align: center; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-cell.active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: #64748b; }
        .dot.done { background: #34d399; }

        /* Görev Listesi */
        .tasks-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .tasks-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary-light); }
        .task-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--primary-light); cursor: pointer; }
        .task-texts { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .task-name { font-weight: 600; font-size: 0.88rem; color: #f1f5f9; }
        .task-desc { font-size: 0.72rem; color: #94a3b8; }

        footer { text-align: center; font-size: 0.72rem; color: #64748b; margin-top: 4px; }
        footer span { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="app-title">🌲 Low-Poly 3D Manevi Ağaç</span>
        <span id="progressBadge" style="font-size: 0.8rem; font-weight: 700; background: rgba(16,185,129,0.2); padding: 4px 10px; border-radius: 20px; color: #34d399;">0 / 6 Tamamlandı</span>
    </header>

    <div class="quote-box" id="quoteBox">"Toprak tamamen kurak... Low-poly manevi ağacını büyütmek için can suyu ver."</div>

    <!-- 3D Sahne Alanı -->
    <div class="scene-container" id="sceneContainer">
        <div class="isometric-world" id="isoWorld">
            <div class="world-base" id="worldBase"></div>
            
            <!-- Low-Poly 3D Ağaç ve Evrim Alanı -->
            <div class="tree-3d-container">
                <svg id="treeSvg" class="low-poly-tree" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dinamik Low-Poly Ağaç Gövdesi ve Yapraklar JavaScript ile yüklenecek -->
                </svg>
                <div class="tree-label" id="treeLabel">1. Aşama: Kurak Filiz</div>
            </div>
        </div>
    </div>

    <!-- Takvim Seçici -->
    <div class="calendar-card" onclick="toggleDrawer()">
        <div class="calendar-header">
            <span id="currentDateLabel">📅 16 Ağustos 2026</span>
            <span style="font-size: 0.75rem; color: #94a3b8;" id="drawerIcon">▼ Takvimi Aç</span>
        </div>
        <div class="drawer" id="calendarDrawer">
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- Görev Listesi -->
    <div class="tasks-card">
        <div class="tasks-title">
            <span>Günün Manevi Amelleri</span>
            <span style="color: #34d399;" id="completionPercent">%0</span>
        </div>

        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="0" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌅 Sabah Namazı</span><span class="task-desc">Toprağa ilk low-poly filiz atıldı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="1" onchange="updateFarm()"><div class="task-texts"><span class="task-name">☀️ Öğle Namazı</span><span class="task-desc">Gövde uzamaya başladı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="2" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌤️ İkindi Namazı</span><span class="task-desc">Dallar filizlenip şekillendi</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="3" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌇 Akşam Namazı</span><span class="task-desc">Low-poly yapraklar yeşermeye başladı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="4" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌙 Yatsı Namazı</span><span class="task-desc">Geniş low-poly taç yapraklar oluştu</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="5" onchange="updateFarm()"><div class="task-texts"><span class="task-name">📿 Günlük Zikir & Dua</span><span class="task-desc">Meyve ve çiçeklerle donanan zirve ağaç</span></div></div></label>
    </div>
</div>

<footer>Ayetin Vakti Ekosistemi • <span>Low-Poly 3D Ağaç Evrimi</span></footer>

<script>
    let activeDay = 16;
    let activeMonth = 8;

    const scene = document.getElementById('sceneContainer');
    const world = document.getElementById('isoWorld');
    
    scene.addEventListener('mousemove', (e) => {
        const rect = scene.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        world.style.transform = `rotateX(${50 - y / 8}deg) rotateZ(${-45 + x / 8}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
        world.style.transform = `rotateX(50deg) rotateZ(-45deg)`;
    });

    function toggleDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const icon = document.getElementById('drawerIcon');
        drawer.classList.toggle('open');
        icon.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        for (let d = 1; d <= 31; d++) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${d === activeDay ? 'active' : ''}`;
            const key = `poly_tree_${activeMonth}_${d}`;
            const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const count = data.filter(Boolean).length;
            
            cell.innerHTML = `<span>${d}</span><div class="dot ${count > 0 ? 'done' : ''}"></div>`;
            cell.onclick = () => { activeDay = d; initCalendar(); loadDay(); };
            grid.appendChild(cell);
        }
        loadDay();
    }

    function loadDay() {
        document.getElementById('currentDateLabel').innerText = `📅 ${activeDay} Ağustos 2026`;
        const key = `poly_tree_${activeMonth}_${activeDay}`;
        const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.task-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = data[idx]);
        renderPolyTree(data, false);
    }

    function updateFarm() {
        const checkboxes = document.querySelectorAll('.task-checkbox');
        const data = Array.from(checkboxes).map(cb => cb.checked);
        const key = `poly_tree_${activeMonth}_${activeDay}`;
        localStorage.setItem(key, JSON.stringify(data));
        initCalendar();
        renderPolyTree(data, true);
    }

    // Low-Poly 3D Ağaç Çizim Fonksiyonu (Fotoğraftaki Aşamalarla Birebir)
    function renderPolyTree(data, animate = true) {
        const count = data.filter(Boolean).length;
        document.getElementById('progressBadge').innerText = `${count} / 6 Tamamlandı`;
        document.getElementById('completionPercent').innerText = `%${Math.round((count/6)*100)}`;

        const base = document.getElementById('worldBase');
        if (count === 0) {
            base.style.background = '#854d0e';
            base.classList.remove('active-island');
        } else {
            base.style.background = '#15803d';
            base.classList.add('active-island');
        }

        const svg = document.getElementById('treeSvg');
        const labelEl = document.getElementById('treeLabel');
        const quoteEl = document.getElementById('quoteBox');

        if (animate) {
            svg.classList.remove('tree-pop');
            void svg.offsetWidth;
            svg.classList.add('tree-pop');
        }

        let svgContent = '';
        let labelText = '';
        let quoteText = '';

        // Gönderdiğin görsele tam uygun Low-Poly Aşama Çizimleri (SVG Poligonları)
        if (count === 0) {
            // Aşama 0: Minik Toprak Parçası
            svgContent = `<polygon points="90,140 110,135 105,160 85,155" fill="#a16207"/><polygon points="90,140 100,130 110,135" fill="#ca8a04"/>`;
            labelText = "Kurak Toprak";
            quoteText = "Toprak tamamen kurak... Low-poly manevi ağacını büyütmek için can suyu ver.";
        } else if (count === 1) {
            // Aşama 1: Küçük Filiz Gövde
            svgContent = `<polygon points="92,120 108,115 105,160 88,155" fill="#92400e"/><polygon points="92,120 100,105 108,115" fill="#b45309"/>`;
            labelText = "1. Aşama: Filiz Gövde";
            quoteText = "Sabah bereketiyle ilk low-poly filiz topraktan başını çıkardı.";
        } else if (count === 2) {
            // Aşama 2: Uzayan Gövde
            svgContent = `<polygon points="90,95 110,90 106,160 86,155" fill="#92400e"/><polygon points="90,95 100,80 110,90" fill="#b45309"/><polygon points="100,80 105,90 115,85" fill="#78350f"/>`;
            labelText = "2. Aşama: Gövde Boy Veriyor";
            quoteText = "Öğle ibadetiyle ağacın gövdesi ve ilk minik dalları belirginleşti.";
        } else if (count === 3) {
            // Aşama 3: Filizlenen Dallar
            svgContent = `<polygon points="92,90 108,85 105,160 88,155" fill="#92400e"/><polygon points="92,90 75,70 90,75" fill="#b45309"/><polygon points="108,85 125,75 115,70" fill="#b45309"/><polygon points="75,70 80,65 88,72" fill="#84cc16"/><polygon points="125,75 120,68 115,72" fill="#84cc16"/>`;
            labelText = "3. Aşama: Dallar Filizleniyor";
            quoteText = "İkindi huzuruyla dallar yanlara doğru açılmaya başladı.";
        } else if (count === 4) {
            // Aşama 4: Yeşil Yaprak Başlangıcı
            svgContent = `<polygon points="92,90 108,85 105,160 88,155" fill="#92400e"/><polygon points="92,90 70,65 90,75" fill="#b45309"/><polygon points="108,85 130,70 115,70" fill="#b45309"/><polygon points="65,60 80,45 90,65" fill="#16a34a"/><polygon points="110,55 135,50 125,75" fill="#22c55e"/><polygon points="85,40 100,30 115,45" fill="#15803d"/>`;
            labelText = "4. Aşama: Yapraklar Yeşeriyor";
            quoteText = "Akşam yaklaşırken low-poly yapraklar kümeler halinde oluştu.";
        } else if (count === 5) {
            // Aşama 5: Geniş Low-Poly Taç Yapraklar
            svgContent = `<polygon points="90,85 110,80 105,160 85,155" fill="#78350f"/><polygon points="75,70 50,55 70,40 90,60" fill="#15803d"/><polygon points="110,70 135,50 150,70 125,85" fill="#16a34a"/><polygon points="80,45 100,20 125,45 105,65" fill="#22c55e"/><polygon points="60,50 75,30 95,45" fill="#4ade80"/>`;
            labelText = "5. Aşama: Ulu Ağaç Tacı";
            quoteText = "Yatsı huzuruyla ağaç muazzam bir low-poly taç yapısıyla donandı.";
        } else if (count === 6) {
            // Aşama 6: Meyveli Zirve Hasat
            svgContent = `<polygon points="90,85 110,80 105,160 85,155" fill="#78350f"/><polygon points="75,70 50,55 70,40 90,60" fill="#15803d"/><polygon points="110,70 135,50 150,70 125,85" fill="#16a34a"/><polygon points="80,45 100,20 125,45 105,65" fill="#22c55e"/><circle cx="70" cy="48" r="4" fill="#ef4444"/><circle cx="115" cy="35" r="4" fill="#ef4444"/><circle cx="95" cy="55" r="4" fill="#eab308"/><circle cx="130" cy="65" r="4" fill="#ef4444"/><circle cx="65" cy="65" r="4" fill="#eab308"/>`;
            labelText = "Zirve: Meyveli Ulu Ağaç";
            quoteText = "✨ Elhamdülillah! Tüm ibadetler tamamlandı; low-poly manevi ağacın meyve ve bereketle taçlandı.";
        }

        svg.innerHTML = svgContent;
        labelEl.innerText = labelText;
        quoteEl.innerText = quoteText;
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });
</script>
</body>
</html>
