<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D İzometrik Çiftlik Simülasyonu | Ayetin Vakti</title>
    <style>
        :root {
            --primary: #059669;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #171f38 50%, #032d22 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Fotoğraftaki Gibi Gerçek 3D İzometrik Sahne Kutusu */
        .scene-container {
            width: 100%;
            height: 330px;
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
        }

        /* 3D İzometrik Ada Dünyası */
        .isometric-world {
            width: 340px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(50deg) rotateZ(-45deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Ana Ada Tabanı (Fotoğraftaki Dikdörtgen Adacık Yapısı) */
        .world-base {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #854d0e; /* Başlangıçta Kurak Toprak */
            border-radius: 12px;
            box-shadow: -25px 25px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
            transition: background 0.8s ease;
        }

        /* Üst Canlı Çim ve Tarla Katmanı */
        .world-base::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2e1065; /* Kurak doku */
            opacity: 0.3;
            border-radius: 12px;
            transition: 0.8s;
        }

        .world-base.active-island {
            background: #15803d; /* Fotoğraftaki canlı yeşil çim alanı */
        }

        /* Fotoğraftaki Tarla Şeritleri (Grid Alanları) */
        .farm-grid {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 270px;
            height: 270px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            pointer-events: none;
            z-index: 2;
        }

        .field-section {
            background: rgba(0, 0, 0, 0.25);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            transition: 0.5s;
        }

        /* Fotoğraftaki Kırmızı Çiftlik Evleri Bölgesi */
        .farm-houses-area {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 110px;
            height: 90px;
            background: rgba(185, 28, 28, 0.15);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            z-index: 3;
            transform: translateZ(10px);
        }

        /* Fotoğraftaki Traktör ve Araç Bölgesi */
        .vehicles-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 3;
            transform: translateZ(15px);
        }

        /* 3D Nesne ve Öğe Stilleri */
        .entity-3d {
            font-size: 1.8rem;
            filter: drop-shadow(4px 8px 10px rgba(0,0,0,0.6));
            transform: translateZ(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pop-effect {
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0) translateZ(40px); opacity: 0; }
            70% { transform: scale(1.3) translateZ(70px); opacity: 1; }
            100% { transform: scale(1) translateZ(25px); opacity: 1; }
        }

        /* Bilgi / Motivasyon Kutusu */
        .quote-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            text-align: center;
            font-style: italic;
            color: #34d399;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* Takvim Paneli */
        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
        .drawer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .drawer.open { max-height: 160px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 110px; overflow-y: auto; }
        .day-cell { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px; text-align: center; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-cell.active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: #64748b; }
        .dot.done { background: #34d399; }

        /* Görev Listesi */
        .tasks-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .tasks-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary-light); }
        .task-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--primary-light); cursor: pointer; }
        .task-texts { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .task-name { font-weight: 600; font-size: 0.88rem; color: #f1f5f9; }
        .task-desc { font-size: 0.72rem; color: #94a3b8; }

        footer { text-align: center; font-size: 0.72rem; color: #64748b; margin-top: 4px; }
        footer span { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="app-title">🌿 3D Çiftlik Simülasyonu</span>
        <span id="progressBadge" style="font-size: 0.8rem; font-weight: 700; background: rgba(16,185,129,0.2); padding: 4px 10px; border-radius: 20px; color: #34d399;">0 / 6 Tamamlandı</span>
    </header>

    <div class="quote-box" id="quoteBox">"Çiftliğin tamamen kurak ve boş... İbadetlerini tamamlayarak can suyu ver."</div>

    <!-- Fotoğraftaki Konseptle Birebir 3D İzometrik Sahne Alanı -->
    <div class="scene-container" id="sceneContainer">
        <div class="isometric-world" id="isoWorld">
            <div class="world-base" id="worldBase"></div>
            
            <div class="farm-grid">
                <div class="field-section" id="field1"></div>
                <div class="field-section" id="field2"></div>
                <div class="field-section" id="field3"></div>
                <div class="field-section" id="field4"></div>
            </div>

            <!-- Fotoğraftaki Çiftlik Evleri -->
            <div class="farm-houses-area" id="housesArea">
               <span class="entity-3d">🏠</span>
            </div>

            <!-- Fotoğraftaki Traktörler ve Araçlar -->
            <div class="vehicles-area" id="vehiclesArea"></div>
        </div>
    </div>

    <!-- Takvim Seçici -->
    <div class="calendar-card" onclick="toggleDrawer()">
        <div class="calendar-header">
            <span id="currentDateLabel">📅 16 Ağustos 2026</span>
            <span style="font-size: 0.75rem; color: #94a3b8;" id="drawerIcon">▼ Takvimi Aç</span>
        </div>
        <div class="drawer" id="calendarDrawer">
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- Görev Listesi -->
    <div class="tasks-card">
        <div class="tasks-title">
            <span>Günün Manevi Amelleri</span>
            <span style="color: #34d399;" id="completionPercent">%0</span>
        </div>

        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="0" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌅 Sabah Namazı</span><span class="task-desc">Kurak toprağa ilk can suyu verildi</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="1" onchange="updateFarm()"><div class="task-texts"><span class="task-name">☀️ Öğle Namazı</span><span class="task-desc">Tarlada yeşermeler başladı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="2" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌤️ İkindi Namazı</span><span class="task-desc">Meyve ağaçları filizlendi</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="3" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌇 Akşam Namazı</span><span class="task-desc">Çiftlik evi şenlendi, çocuklar oynamaya başladı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="4" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌙 Yatsı Namazı</span><span class="task-desc">Ağaçlar meyveyle doldu, tarlalar başak verdi</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="5" onchange="updateFarm()"><div class="task-texts"><span class="task-name">📿 Günlük Zikir & Dua</span><span class="task-desc">Altın sarısı zirve hasat ve neşe bereketi</span></div></div></label>
    </div>
</div>

<footer>Ayetin Vakti Ekosistemi • <span>İnteraktif 3D Çiftlik Deneyimi</span></footer>

<script>
    let activeDay = 16;
    let activeMonth = 8; // Ağustos

    // Fare hareketiyle 3D adayı canlı döndürme efekti
    const scene = document.getElementById('sceneContainer');
    const world = document.getElementById('isoWorld');
    
    scene.addEventListener('mousemove', (e) => {
        const rect = scene.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        world.style.transform = `rotateX(${50 - y / 8}deg) rotateZ(${-45 + x / 8}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
        world.style.transform = `rotateX(50deg) rotateZ(-45deg)`;
    });

    function toggleDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const icon = document.getElementById('drawerIcon');
        drawer.classList.toggle('open');
        icon.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        for (let d = 1; d <= 31; d++) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${d === activeDay ? 'active' : ''}`;
            const key = `farm_day_${activeMonth}_${d}`;
            const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const count = data.filter(Boolean).length;
            
            cell.innerHTML = `<span>${d}</span><div class="dot ${count > 0 ? 'done' : ''}"></div>`;
            cell.onclick = () => { activeDay = d; initCalendar(); loadDay(); };
            grid.appendChild(cell);
        }
        loadDay();
    }

    function loadDay() {
        document.getElementById('currentDateLabel').innerText = `📅 ${activeDay} Ağustos 2026`;
        const key = `farm_day_${activeMonth}_${activeDay}`;
        const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.task-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = data[idx]);
        renderFarm(data, false);
    }

    function updateFarm() {
        const checkboxes = document.querySelectorAll('.task-checkbox');
        const data = Array.from(checkboxes).map(cb => cb.checked);
        const key = `farm_day_${activeMonth}_${activeDay}`;
        localStorage.setItem(key, JSON.stringify(data));
        initCalendar();
        renderFarm(data, true);
    }

    function renderFarm(data, animate = true) {
        const count = data.filter(Boolean).length;
        document.getElementById('progressBadge').innerText = `${count} / 6 Tamamlandı`;
        document.getElementById('completionPercent').innerText = `%${Math.round((count/6)*100)}`;

        // Adanın Zemin Renk Dönüşümü (Kuraktan Fotoğraftaki Canlı Çime)
        const base = document.getElementById('worldBase');
        if (count === 0) {
            base.style.background = '#854d0e'; // Kurak toprak
            base.classList.remove('active-island');
        } else {
            base.style.background = '#15803d'; // Fotoğraftaki canlı yeşil çim
            base.classList.add('active-island');
        }

        // Motivasyon Mesajları
        const quotes = [
            "Çiftliğin tamamen kurak ve boş... İbadetlerini tamamlayarak can suyu ver.",
            "Sabah bereketiyle ilk tarlalar canlandı.",
            "Öğle ibadetiyle yeşermeler tarlayı sardı.",
            "İkindi bereketiyle ağaçlar ve çiftlik evi şenlendi.",
            "Akşam huzuruyla traktörler ve çalışanlar sahneye katıldı.",
            "Yatsı bereketiyle tarlalar başak verdi.",
            "✨ Zirve Hasat! Çiftliğin altın sarısı bereketle doldu taştı!"
        ];
        document.getElementById('quoteBox').innerText = quotes[count];

        // 4 Farklı Tarla Bölümünü Doldurma (Fotoğraftaki Şerit Sistemine Göre)
        const f1 = document.getElementById('field1');
        const f2 = document.getElementById('field2');
        const f3 = document.getElementById('field3');
        const f4 = document.getElementById('field4');

        f1.innerHTML = ''; f2.innerHTML = ''; f3.innerHTML = ''; f4.innerHTML = '';

        let cropIcon = count === 0 ? "🟤" : (count < 3 ? "🌱" : (count < 6 ? "🌿" : "🌾"));
        
        // Tarla 1
        let e1 = document.createElement('div');
        e1.className = `entity-3d ${animate ? 'pop-effect' : ''}`;
        e1.innerText = cropIcon;
        f1.appendChild(e1);

        // Tarla 2 (İkinci aşamada başak/ürün eklenir)
        if (count >= 2) {
            let e2 = document.createElement('div');
            e2.className = `entity-3d ${animate ? 'pop-effect' : ''}`;
            e2.innerText = "🌾";
            f2.appendChild(e2);
        }

        // Tarla 3 (Ağaçlar ve yeşillikler)
        if (count >= 3) {
            let e3 = document.createElement('div');
            e3.className = `entity-3d ${animate ? 'pop-effect' : ''}`;
            e3.innerText = "🌳";
            f3.appendChild(e3);
        }

        // Tarla 4 (Hasat / Altın Başak)
        if (count >= 5) {
            let e4 = document.createElement('div');
            e4.className = `entity-3d ${animate ? 'pop-effect' : ''}`;
            e4.innerText = "🌽";
            f4.appendChild(e4);
        }

        // Fotoğraftaki Traktör ve Araçların Belirme Mantığı
        const vehiclesArea = document.getElementById('vehiclesArea');
        vehiclesArea.innerHTML = '';

        if (count >= 4) {
            let tractor = document.createElement('div');
            tractor.className = `entity-3d ${animate ? 'pop-effect' : ''}`;
            tractor.innerText = "🚜";
            vehiclesArea.appendChild(tractor);
        }

        if (count >= 6) {
            let truck = document.createElement('div');
            truck.className = `entity-3d ${animate ? 'pop-effect' : ''}`;
            truck.innerText = "🚚";
            vehiclesArea.appendChild(truck);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });
</script>
</body>
</html>
