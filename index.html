<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manevi Tarla | 5-5 Namaz</title>
    <meta name="theme-color" content="#10b981">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
            
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; transition: 0.3s; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
        
        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; color: var(--text-color); font-size: 1.25rem; cursor: pointer; text-decoration: none; }
        .app-title { font-size: 1.15rem; font-weight: 700; color: var(--accent-color); text-decoration: none; font-family: 'Georgia', serif; }

        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
        .section-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; }

        /* Gelişmiş Tarla Ekranı & Animasyonlar */
        .farm-screen { 
            background: linear-gradient(135deg, #1e3a8a 0%, #065f46 100%); 
            border-radius: 20px; 
            padding: 24px; 
            text-align: center; 
            color: #fff; 
            position: relative; 
            overflow: hidden; 
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
        }

        .farm-visual { 
            font-size: 4rem; 
            margin: 12px 0; 
            animation: bounceSlow 3s infinite ease-in-out;
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .farm-status { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.3px; }
        .farm-desc { font-size: 0.85rem; opacity: 0.9; margin-bottom: 14px; }

        /* Hasat / İlerleme Çubuğu */
        .progress-bar-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #facc15;
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* İbadet Listesi */
        .ibadet-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 14px; cursor: pointer; transition: 0.2s; user-select: none; }
        .ibadet-item:hover { border-color: var(--accent-color); transform: translateY(-1px); }
        .ibadet-info { display: flex; align-items: center; gap: 14px; }
        .ibadet-checkbox { width: 22px; height: 22px; accent-color: var(--accent-color); cursor: pointer; }
        .ibadet-name { font-weight: 600; font-size: 0.95rem; }
        
        .footer { margin: 20px 0; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
        .footer span { color: var(--accent-color); font-weight: 600; }

        body.light-mode { --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <div class="nav-left">
            <a href="https://ayetinvakti.github.io/settings" class="back-btn">←</a>
            <span class="app-title">🌾 Manevi Tarla & Hasat</span>
        </div>
    </header>

    <!-- TARLA / HASAT GÖRSEL ALANI -->
    <div class="farm-screen" id="farmScreen">
        <div class="farm-visual" id="farmVisual">🏜️</div>
        <div class="farm-status" id="farmStatus">Kurak Toprak</div>
        <div class="farm-desc" id="farmDesc">İbadetlerini tamamla, tarlanı can suyuyla yeşert.</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- İBADETLERİ İŞARETLEME KARTI -->
    <div class="card">
        <div class="section-title">Bugünkü İbadetlerim</div>
        
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-id="sabah" onchange="updateFarm()">
                <span class="ibadet-name">🌅 Sabah Namazı</span>
            </div>
        </label>

        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-id="ogle" onchange="updateFarm()">
                <span class="ibadet-name">☀️ Öğle Namazı</span>
            </div>
        </label>

        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-id="ikindi" onchange="updateFarm()">
                <span class="ibadet-name">🌤️ İkindi Namazı</span>
            </div>
        </label>

        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-id="aksam" onchange="updateFarm()">
                <span class="ibadet-name">🌇 Akşam Namazı</span>
            </div>
        </label>

        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-id="yatsi" onchange="updateFarm()">
                <span class="ibadet-name">🌙 Yatsı Namazı</span>
            </div>
        </label>

        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-id="zikir" onchange="updateFarm()">
                <span class="ibadet-name">📿 Günlük Zikir & Dua</span>
            </div>
        </label>
    </div>
</div>

<div class="footer">Ayetin Vakti Ekosistemi • <span>5-5 Namaz Takibi</span></div>

<script>
    function updateFarm() {
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        let completedCount = 0;
        const total = checkboxes.length;
        
        checkboxes.forEach((cb, index) => {
            if (cb.checked) completedCount++;
            localStorage.setItem('ibadet_' + index, cb.checked);
        });

        const visual = document.getElementById('farmVisual');
        const status = document.getElementById('farmStatus');
        const desc = document.getElementById('farmDesc');
        const progressFill = document.getElementById('progressFill');

        // Yüzde hesapla
        const percentage = (completedCount / total) * 100;
        progressFill.style.width = percentage + '%';

        if (completedCount === 0) {
            visual.innerText = "🏜️";
            status.innerText = "Kurak Toprak";
            desc.innerText = "Tohum ekilmeyi ve can suyu bekliyor...";
        } else if (completedCount === 1) {
            visual.innerText = "🌱💧";
            status.innerText = "İlk Can Suyu Verildi";
            desc.innerText = "Maşallah! İlk adım atıldı, filizler uyanıyor.";
        } else if (completedCount <= 3) {
            visual.innerText = "🌿🪴";
            status.innerText = "Filizler Büyüyor";
            desc.innerText = "Gayretinle tarlan yeşillenmeye ve kök salmaya başladı.";
        } else if (completedCount < 6) {
            visual.innerText = "🌳🍏✨";
            status.innerText = "Meyve Bahçesi";
            desc.innerText = "Çok az kaldı! Dallar meyveyle dolmak üzere.";
        } else {
            visual.innerText = "🌾🚜🏆";
            status.innerText = "Altın Hasat Vakti!";
            desc.innerText = "Elhamdülillah, tarlanın bereketi zirvede! Harika iş çıkardın.";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        checkboxes.forEach((cb, index) => {
            const savedState = localStorage.getItem('ibadet_' + index) === 'true';
            cb.checked = savedState;
        });
        updateFarm();
    });
</script>
</body>
</html>
