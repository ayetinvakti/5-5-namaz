<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Low-Poly Manevi Ada ve Ağaç Simülasyonu</title>
    <style>
        :root {
            --primary: #059669;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #064e3b 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 3D Sahne Alanı */
        .scene-container {
            width: 100%;
            height: 360px;
            background: linear-gradient(to bottom, #6366f1 0%, #38bdf8 45%, #1e293b 100%);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        /* Havada Süzülen 3D Low-Poly Ada */
        .floating-island {
            width: 240px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(55deg) rotateZ(-45deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Ada Üst Yeşil Katman (3D Low-Poly Efektli) */
        .island-top {
            position: absolute;
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            clip-path: polygon(30% 0%, 70% 5%, 100% 30%, 95% 70%, 70% 100%, 30% 95%, 5% 70%, 0% 30%);
            transform: translateZ(0px);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.3);
            transition: background 0.8s ease;
        }

        .island-top.kurak {
            background: linear-gradient(135deg, #d97706 0%, #92400e 100%);
        }

        /* Ada Alt Toprak Kütlesi (Hacimli 3D Derinlik) */
        .island-bottom {
            position: absolute;
            width: 220px;
            height: 220px;
            background: #361502;
            clip-path: polygon(30% 0%, 70% 5%, 100% 30%, 95% 70%, 70% 100%, 30% 95%, 5% 70%, 0% 30%);
            transform: translateZ(-55px) scale(0.85);
            box-shadow: 0 50px 90px rgba(0,0,0,0.95);
            filter: brightness(0.65);
        }

        /* 3D Ağaç Konteyneri */
        .tree-3d-model {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(12px);
            width: 160px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        svg.poly-tree-svg {
            width: 170px;
            height: 190px;
            filter: drop-shadow(12px 22px 25px rgba(0,0,0,0.85));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tree-pop {
            animation: treeAnim 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes treeAnim {
            0% { transform: scale(0.5) translateZ(10px); opacity: 0.4; }
            70% { transform: scale(1.2) translateZ(45px); opacity: 1; }
            100% { transform: scale(1) translateZ(30px); opacity: 1; }
        }

        .tree-label {
            position: absolute;
            bottom: -22px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: #6ee7b7;
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            transform: translateZ(40px);
        }

        .quote-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            text-align: center;
            font-style: italic;
            color: #34d399;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* Takvim Paneli */
        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
        .drawer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .drawer.open { max-height: 160px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 110px; overflow-y: auto; }
        .day-cell { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px; text-align: center; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-cell.active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: #64748b; }
        .dot.done { background: #34d399; }

        /* Görev Listesi */
        .tasks-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .tasks-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary-light); }
        .task-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--primary-light); cursor: pointer; }
        .task-texts { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .task-name { font-weight: 600; font-size: 0.88rem; color: #f1f5f9; }
        .task-desc { font-size: 0.72rem; color: #94a3b8; }

        footer { text-align: center; font-size: 0.72rem; color: #64748b; margin-top: 4px; }
        footer span { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="app-title">🏝️ Gerçek 3D Low-Poly Ada</span>
        <span id="progressBadge" style="font-size: 0.8rem; font-weight: 700; background: rgba(16,185,129,0.2); padding: 4px 10px; border-radius: 20px; color: #34d399;">0 / 6 Tamamlandı</span>
    </header>

    <div class="quote-box" id="quoteBox">"Ada toprakları kurak... 3D low-poly ağacı büyütmek için görevleri tamamla."</div>

    <!-- 3D Sahne Alanı -->
    <div class="scene-container" id="sceneContainer">
        <div class="floating-island" id="floatingIsland">
            <div class="island-bottom"></div>
            <div class="island-top kurak" id="islandTop"></div>
            
            <!-- Gerçek 3D Hacimli Ağaç Modeli -->
            <div class="tree-3d-model">
                <svg id="polyTreeSvg" class="poly-tree-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gerçek 3D Hacim Gölgeleri ve Gradyanlar -->
                        <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#78350f"/>
                            <stop offset="50%" stop-color="#b45309"/>
                            <stop offset="100%" stop-color="#451a03"/>
                        </linearGradient>
                        <radialGradient id="leafGrad1" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#4ade80"/>
                            <stop offset="70%" stop-color="#16a34a"/>
                            <stop offset="100%" stop-color="#14532d"/>
                        </radialGradient>
                        <radialGradient id="leafGrad2" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#86efac"/>
                            <stop offset="70%" stop-color="#22c55e"/>
                            <stop offset="100%" stop-color="#15803d"/>
                        </radialGradient>
                    </defs>
                    <!-- Dinamik 3D Ağaç Çizimi -->
                </svg>
                <div class="tree-label" id="treeLabel">1. Aşama: Kurak Filiz</div>
            </div>
        </div>
    </div>

    <!-- Takvim Seçici -->
    <div class="calendar-card" onclick="toggleDrawer()">
        <div class="calendar-header">
            <span id="currentDateLabel">📅 16 Ağustos 2026</span>
            <span style="font-size: 0.75rem; color: #94a3b8;" id="drawerIcon">▼ Takvimi Aç</span>
        </div>
        <div class="drawer" id="calendarDrawer">
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- Görev Listesi -->
    <div class="tasks-card">
        <div class="tasks-title">
            <span>Günün Manevi Amelleri</span>
            <span style="color: #34d399;" id="completionPercent">%0</span>
        </div>

        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="0" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌅 Sabah Namazı</span><span class="task-desc">Toprağa ilk 3D filiz bırakıldı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="1" onchange="updateFarm()"><div class="task-texts"><span class="task-name">☀️ Öğle Namazı</span><span class="task-desc">Gövde silindirik hacim kazandı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="2" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌤️ İkindi Namazı</span><span class="task-desc">3D geometrik dallar uzadı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="3" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌇 Akşam Namazı</span><span class="task-desc">Low-poly küre yaprak kümeleri</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="4" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌙 Yatsı Namazı</span><span class="task-desc">Geniş 3D taç yapraklar oluştu</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="5" onchange="updateFarm()"><div class="task-texts"><span class="task-name">📿 Günlük Zikir & Dua</span><span class="task-desc">Meyvelerle donanan 3D ulu ağaç</span></div></div></label>
    </div>
</div>

<footer>Ayetin Vakti Ekosistemi • <span>Gerçek 3D Low-Poly Görünüm</span></footer>

<script>
    let activeDay = 16;
    let activeMonth = 8;

    const scene = document.getElementById('sceneContainer');
    const island = document.getElementById('floatingIsland');
    
    scene.addEventListener('mousemove', (e) => {
        const rect = scene.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        island.style.transform = `rotateX(${55 - y / 7}deg) rotateZ(${-45 + x / 7}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
        island.style.transform = `rotateX(55deg) rotateZ(-45deg)`;
    });

    function toggleDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const icon = document.getElementById('drawerIcon');
        drawer.classList.toggle('open');
        icon.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        for (let d = 1; d <= 31; d++) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${d === activeDay ? 'active' : ''}`;
            const key = `real3d_tree_${activeMonth}_${d}`;
            const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const count = data.filter(Boolean).length;
            
            cell.innerHTML = `<span>${d}</span><div class="dot ${count > 0 ? 'done' : ''}"></div>`;
            cell.onclick = () => { activeDay = d; initCalendar(); loadDay(); };
            grid.appendChild(cell);
        }
        loadDay();
    }

    function loadDay() {
        document.getElementById('currentDateLabel').innerText = `📅 ${activeDay} Ağustos 2026`;
        const key = `real3d_tree_${activeMonth}_${activeDay}`;
        const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.task-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = data[idx]);
        renderReal3DTree(data, false);
    }

    function updateFarm() {
        const checkboxes = document.querySelectorAll('.task-checkbox');
        const data = Array.from(checkboxes).map(cb => cb.checked);
        const key = `real3d_tree_${activeMonth}_${activeDay}`;
        localStorage.setItem(key, JSON.stringify(data));
        initCalendar();
        renderReal3DTree(data, true);
    }

    // Örnek Resimdeki Gibi Gerçek 3D Hacimli Low-Poly Çizim Motoru
    function renderReal3DTree(data, animate = true) {
        const count = data.filter(Boolean).length;
        document.getElementById('progressBadge').innerText = `${count} / 6 Tamamlandı`;
        document.getElementById('completionPercent').innerText = `%${Math.round((count/6)*100)}`;

        const islandTop = document.getElementById('islandTop');
        if (count === 0) {
            islandTop.classList.add('kurak');
        } else {
            islandTop.classList.remove('kurak');
        }

        const svg = document.getElementById('polyTreeSvg');
        const labelEl = document.getElementById('treeLabel');
        const quoteEl = document.getElementById('quoteBox');

        if (animate) {
            svg.classList.remove('tree-pop');
            void svg.offsetWidth;
            svg.classList.add('tree-pop');
        }

        // Sabit SVG Gradient Tanımları Korunarak İçerik Güncelleniyor
        let defsHTML = svg.querySelector('defs').outerHTML;
        let svgContent = '';
        let labelText = '';
        let quoteText = '';

        if (count === 0) {
            // Aşama 0: Kurak Zemin Taş Parçası
            svgContent = `
                <polygon points="92,135 110,130 106,155 88,150" fill="url(#trunkGrad)"/>
                <polygon points="92,135 101,122 110,130" fill="#d97706"/>`;
            labelText = "Kurak Ada Toprağı";
            quoteText = "Ada toprakları kurak... 3D low-poly ağacı büyütmek için görevleri tamamla.";
        } else if (count === 1) {
            // Aşama 1: Filiz Gövde
            svgContent = `
                <path d="M 94 140 Q 98 115 100 100 Q 102 115 106 140 Z" fill="url(#trunkGrad)" filter="drop-shadow(2px 2px 2px rgba(0,0,0,0.5))"/>
                <polygon points="94,140 100,100 106,140" fill="#b45309" opacity="0.6"/>`;
            labelText = "1. Aşama: Filiz Gövde";
            quoteText = "Sabah bereketiyle ilk 3D hacimli filiz yükseldi.";
        } else if (count === 2) {
            // Aşama 2: Kalınlaşan Gövde ve Minik Dallar
            svgContent = `
                <path d="M 90 150 Q 96 110 98 85 Q 102 110 110 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 98 105 L 78 85" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
                <path d="M 100 100 L 122 82" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>`;
            labelText = "2. Aşama: Gövde Silindirik Hacim Kazandı";
            quoteText = "Öğle ibadetiyle gövde kalınlaştı ve kollara ayrıldı.";
        } else if (count === 3) {
            // Aşama 3: Geometrik Dallar Genişliyor
            svgContent = `
                <path d="M 90 150 Q 96 110 98 80 Q 102 110 110 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 98 100 C 80 90 65 75 55 60" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
                <path d="M 98 95 C 115 88 130 72 142 58" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
                <polygon points="50,55 65,45 60,65" fill="url(#leafGrad1)"/>
                <polygon points="138,52 150,65 132,68" fill="url(#leafGrad2)"/>`;
            labelText = "3. Aşama: 3D Geometrik Dallar Uzadı";
            quoteText = "İkindi huzuruyla ana dallar etrafa doğru yayıldı.";
        } else if (count === 4) {
            // Aşama 4: Low-Poly Küresel Yaprak Kümeleri Başlıyor
            svgContent = `
                <path d="M 90 150 Q 96 110 98 80 Q 102 110 110 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 98 100 C 80 90 65 75 55 60" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
                <path d="M 98 95 C 115 88 130 72 142 58" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
                <!-- 3D Low-Poly Küre Grupları -->
                <polygon points="55,50 75,30 85,55 60,70" fill="url(#leafGrad1)" filter="drop-shadow(3px 4px 4px rgba(0,0,0,0.4))"/>
                <polygon points="120,40 145,35 150,60 125,65" fill="url(#leafGrad2)" filter="drop-shadow(3px 4px 4px rgba(0,0,0,0.4))"/>
                <polygon points="85,30 115,20 125,48 95,55" fill="url(#leafGrad1)" filter="drop-shadow(3px 4px 4px rgba(0,0,0,0.4))"/>`;
            labelText = "4. Aşama: 3D Low-Poly Yaprak Kümeleri";
            quoteText = "Akşam yaklaşırken örnek resimdeki gibi hacimli low-poly yapraklar oluştu.";
        } else if (count === 5) {
            // Aşama 5: Tam Donanımlı 3D Ulu Ağaç Tacı
            svgContent = `
                <path d="M 88 150 Q 95 110 98 75 Q 103 110 112 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 98 105 C 75 90 50 70 45 50" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
                <path d="M 98 95 C 120 90 145 72 152 50" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
                <path d="M 98 85 C 100 70 102 55 100 35" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
                <!-- Hacimli 3D Low-Poly Küreler -->
                <polygon points="40,55 65,30 85,50 60,75" fill="url(#leafGrad1)" filter="drop-shadow(4px 6px 6px rgba(0,0,0,0.5))"/>
                <polygon points="120,45 150,30 160,60 130,70" fill="url(#leafGrad2)" filter="drop-shadow(4px 6px 6px rgba(0,0,0,0.5))"/>
                <polygon points="75,25 110,10 130,40 95,55" fill="url(#leafGrad1)" filter="drop-shadow(4px 6px 6px rgba(0,0,0,0.5))"/>
                <polygon points="90,40 120,25 135,55 105,65" fill="url(#leafGrad2)" filter="drop-shadow(2px 3px 3px rgba(0,0,0,0.3))"/>`;
            labelText = "5. Aşama: Muazzam 3D Ulu Ağaç Tacı";
            quoteText = "Yatsı huzuruyla ağacın 3D hacmi örnek resimle mükemmel uyuma ulaştı.";
        } else if (count === 6) {
            // Aşama 6: Meyveli 3D Zirve Ağaç (Örnek Resmin Birebir Aynısı)
            svgContent = `
                <path d="M 88 150 Q 95 110 98 75 Q 103 110 112 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 98 105 C 75 90 50 70 45 50" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
                <path d="M 98 95 C 120 90 145 72 152 50" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
                <path d="M 98 85 C 100 70 102 55 100 35" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
                <!-- Hacimli 3D Low-Poly Küreler -->
                <polygon points="40,55 65,30 85,50 60,75" fill="url(#leafGrad1)" filter="drop-shadow(4px 6px 6px rgba(0,0,0,0.5))"/>
                <polygon points="120,45 150,30 160,60 130,70" fill="url(#leafGrad2)" filter="drop-shadow(4px 6px 6px rgba(0,0,0,0.5))"/>
                <polygon points="75,25 110,10 130,40 95,55" fill="url(#leafGrad1)" filter="drop-shadow(4px 6px 6px rgba(0,0,0,0.5))"/>
                <polygon points="90,40 120,25 135,55 105,65" fill="url(#leafGrad2)" filter="drop-shadow(2px 3px 3px rgba(0,0,0,0.3))"/>
                <!-- Low-Poly 3D Kristal Meyveler -->
                <polygon points="55,45 62,40 66,48 58,53" fill="#ef4444"/>
                <polygon points="135,38 142,33 146,41 138,46" fill="#ef4444"/>
                <polygon points="100,22 107,17 111,25 103,30" fill="#eab308"/>
                <polygon points="115,52 122,47 126,55 118,60" fill="#ef4444"/>
                <polygon points="70,60 77,55 81,63 73,68" fill="#eab308"/>`;
            labelText = "Zirve: Meyveli 3D Ulu Ağaç";
            quoteText = "✨ Elhamdülillah! Tüm ibadetler tamamlandı; örnek resimdeki gibi 3D low-poly ulu ağaç meyveleriyle donandı.";
        }

        svg.innerHTML = defsHTML + svgContent;
        labelEl.innerText = labelText;
        quoteEl.innerText = quoteText;
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });
</script>
</body>
</html>
