<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manevi Tarla ve Hasat Takvimi | 5-5 Namaz</title>
    <meta name="theme-color" content="#10b981">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
            
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --soil-color: #3b281a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; transition: 0.3s; }
        .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }
        
        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; color: var(--text-color); font-size: 1.25rem; cursor: pointer; text-decoration: none; }
        .app-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-color); text-decoration: none; font-family: 'Georgia', serif; }

        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
        .section-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-color); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }

        /* Gerçekçi CSS Tarla ve Animasyon Alanı */
        .farm-screen { 
            background: var(--soil-color); 
            border-radius: 20px; 
            padding: 24px; 
            text-align: center; 
            color: #fff; 
            position: relative; 
            overflow: hidden; 
            border: 3px solid #271a10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            transition: background 1s ease;
        }

        /* Büyüyen Bitki Çubuğu */
        .plant-stalk {
            width: 24px;
            height: 0%;
            background: var(--accent-color);
            border-radius: 12px 12px 0 0;
            transition: height 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.5s ease;
            position: relative;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
        }

        /* Hasat Altın Işıltı Efekti */
        .plant-stalk::after {
            content: '';
            position: absolute;
            top: -15px;
            left: -18px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(250,204,21,0.6) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            border-radius: 50%;
        }
        .farm-screen.harvested .plant-stalk::after {
            opacity: 1;
        }

        .farm-info-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .farm-status { font-size: 0.95rem; font-weight: 700; color: #f8fafc; }
        .farm-desc { font-size: 0.75rem; color: #cbd5e1; }

        .progress-bar-container { width: 100%; background: rgba(255, 255, 255, 0.15); border-radius: 10px; height: 6px; overflow: hidden; margin-top: 6px; }
        .progress-bar-fill { height: 100%; width: 0%; background: #facc15; border-radius: 10px; transition: width 0.5s ease; }

        /* Ay ve Gün Seçici Bölümü */
        .selector-row { display: flex; gap: 10px; }
        select { flex: 1; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 12px; font-size: 0.9rem; cursor: pointer; font-weight: 600; }

        /* Günlük Grid Takvimi */
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
        .day-box { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 4px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .day-box:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .day-box.active { border-color: var(--accent-color); background: rgba(16, 185, 129, 0.15); }
        .day-num { font-size: 0.85rem; font-weight: 700; }
        .day-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-color); transition: 0.2s; }
        .day-dot.completed { background: var(--accent-color); box-shadow: 0 0 6px var(--accent-color); }

        /* İbadet Listesi */
        .ibadet-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: 0.2s; user-select: none; }
        .ibadet-item:hover { border-color: var(--accent-color); }
        .ibadet-info { display: flex; align-items: center; gap: 12px; }
        .ibadet-checkbox { width: 20px; height: 20px; accent-color: var(--accent-color); cursor: pointer; }
        .ibadet-name { font-weight: 600; font-size: 0.9rem; }

        .footer { margin: 20px 0; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
        .footer span { color: var(--accent-color); font-weight: 600; }

        body.light-mode { --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; --soil-color: #d7ccc8; }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <div class="nav-left">
            <a href="https://ayetinvakti.github.io/settings" class="back-btn">←</a>
            <span class="app-title">🌾 Yıllık Tarla & İbadet Takvimi</span>
        </div>
    </header>

    <!-- GERÇEKÇİ CSS TARLA ALANI -->
    <div class="farm-screen" id="farmScreen">
        <div class="farm-info-overlay">
            <div>
                <div class="farm-status" id="farmStatus">Kurak Toprak</div>
                <div class="farm-desc" id="farmDesc">Tohum bekleniyor</div>
            </div>
            <div style="width: 100px;">
                <div style="font-size: 0.7rem; text-align: right; margin-bottom: 2px;" id="progressText">%0</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <!-- Büyüyen Bitki -->
        <div class="plant-stalk" id="plantStalk"></div>
    </div>

    <!-- AY VE GÜN SEÇİCİ -->
    <div class="card">
        <div class="section-title">
            <span>Ay Seçimi ve Günlük Takvim</span>
            <span id="selectedDateText" style="font-size:0.75rem; color:var(--text-muted);"></span>
        </div>
        
        <div class="selector-row">
            <select id="monthSelect" onchange="changeMonth()">
                <option value="0">Ocak</option>
                <option value="1">Şubat</option>
                <option value="2">Mart</option>
                <option value="3">Nisan</option>
                <option value="4">Mayıs</option>
                <option value="5">Haziran</option>
                <option value="6">Temmuz</option>
                <option value="7" selected>Ağustos</option>
                <option value="8">Eylül</option>
                <option value="9">Ekim</option>
                <option value="10">Kasım</option>
                <option value="11">Aralık</option>
            </select>
        </div>

        <!-- Günlerin Kutucukları (Grid) -->
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- SEÇİLEN GÜNÜN İBADETLERİ -->
    <div class="card">
        <div class="section-title" id="dailyCardTitle">Seçilen Günün İbadetleri</div>
        
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-index="0" onchange="updateDayData()">
                <span class="ibadet-name">🌅 Sabah Namazı</span>
            </div>
        </label>
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-index="1" onchange="updateDayData()">
                <span class="ibadet-name">☀️ Öğle Namazı</span>
            </div>
        </label>
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-index="2" onchange="updateDayData()">
                <span class="ibadet-name">🌤️ İkindi Namazı</span>
            </div>
        </label>
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-index="3" onchange="updateDayData()">
                <span class="ibadet-name">🌇 Akşam Namazı</span>
            </div>
        </label>
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-index="4" onchange="updateDayData()">
                <span class="ibadet-name">🌙 Yatsı Namazı</span>
            </div>
        </label>
        <label class="ibadet-item">
            <div class="ibadet-info">
                <input type="checkbox" class="ibadet-checkbox" data-index="5" onchange="updateDayData()">
                <span class="ibadet-name">📿 Günlük Zikir & Dua</span>
            </div>
        </label>
    </div>
</div>

<div class="footer">Ayetin Vakti Ekosistemi • <span>5-5 Namaz Takibi</span></div>

<script>
    let currentMonth = parseInt(document.getElementById('monthSelect').value);
    let selectedDay = new Date().getDate();

    const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        const totalDays = monthDays[currentMonth];

        if (selectedDay > totalDays) selectedDay = totalDays;

        for (let d = 1; d <= totalDays; d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box' + (d === selectedDay ? ' active' : '');
            
            const key = `ibadet_${currentMonth}_${d}`;
            const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const completedCount = savedData.filter(Boolean).length;
            const isFullyCompleted = completedCount === 6;

            dayBox.innerHTML = `
                <span class="day-num">${d}</span>
                <div class="day-dot ${isFullyCompleted ? 'completed' : (completedCount > 0 ? 'completed' : '')}" style="opacity: ${completedCount > 0 ? 1 : 0.3}"></div>
            `;

            dayBox.onclick = () => {
                selectedDay = d;
                initCalendar();
                loadDayData();
            };
            grid.appendChild(dayBox);
        }
        loadDayData();
    }

    function changeMonth() {
        currentMonth = parseInt(document.getElementById('monthSelect').value);
        initCalendar();
    }

    function loadDayData() {
        const key = `ibadet_${currentMonth}_${selectedDay}`;
        const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        checkboxes.forEach((cb, idx) => {
            cb.checked = savedData[idx];
        });

        document.getElementById('selectedDateText').innerText = `${selectedDay} ${document.getElementById('monthSelect').options[currentMonth].text}`;
        document.getElementById('dailyCardTitle').innerText = `${selectedDay} ${document.getElementById('monthSelect').options[currentMonth].text} İbadetleri`;
        
        updateFarmVisual(savedData);
    }

    function updateDayData() {
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        let data = [];
        checkboxes.forEach(cb => data.push(cb.checked));

        const key = `ibadet_${currentMonth}_${selectedDay}`;
        localStorage.setItem(key, JSON.stringify(data));

        initCalendar();
        updateFarmVisual(data);
    }

    function updateFarmVisual(data) {
        const completedCount = data.filter(Boolean).length;
        const total = data.length;
        const percentage = Math.round((completedCount / total) * 100);

        document.getElementById('progressFill').style.width = percentage + '%';
        document.getElementById('progressText').innerText = `%${percentage}`;

        const farmScreen = document.getElementById('farmScreen');
        const plantStalk = document.getElementById('plantStalk');
        const status = document.getElementById('farmStatus');
        const desc = document.getElementById('farmDesc');

        // Gerçekçi yükseklik ve renk değişimi
        plantStalk.style.height = percentage + '%';

        if (completedCount === 0) {
            farmScreen.style.background = "#3b281a";
            plantStalk.style.background = "var(--accent-color)";
            farmScreen.classList.remove('harvested');
            status.innerText = "Kurak Toprak";
            desc.innerText = "Can suyu bekleniyor";
        } else if (completedCount <= 3) {
            farmScreen.style.background = "#283824";
            plantStalk.style.background = "#34d399";
            farmScreen.classList.remove('harvested');
            status.innerText = "Filizlenen Tarla";
            desc.innerText = "Kökler güçleniyor";
        } else if (completedCount < 6) {
            farmScreen.style.background = "#1b4332";
            plantStalk.style.background = "#10b981";
            farmScreen.classList.remove('harvested');
            status.innerText = "Yeşeren Bahçe";
            desc.innerText = "Hasada çok az kaldı";
        } else {
            farmScreen.style.background = "#0f5132";
            plantStalk.style.background = "#facc15";
            farmScreen.classList.add('harvested');
            status.innerText = "Altın Hasat Vakti!";
            desc.innerText = "Berekete ulaşıldı!";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        currentMonth = now.getMonth();
        selectedDay = now.getDate();
        document.getElementById('monthSelect').value = currentMonth;
        initCalendar();
    });
</script>
</body>
</html>
