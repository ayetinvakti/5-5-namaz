<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Low-Poly Manevi Ada ve Ağaç Simülasyonu</title>
    <style>
        :root {
            --primary: #059669;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #064e3b 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 3D Sahne Alanı */
        .scene-container {
            width: 100%;
            height: 360px;
            background: linear-gradient(to bottom, #4f46e5 0%, #0284c7 40%, #0f172a 100%);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        /* Havada Süzülen 3D Low-Poly Ada */
        .floating-island {
            width: 240px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(55deg) rotateZ(-45deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Ada Üst Yeşil Katman (Low-Poly Yüzey) */
        .island-top {
            position: absolute;
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            clip-path: polygon(30% 0%, 70% 5%, 100% 30%, 95% 70%, 70% 100%, 30% 95%, 5% 70%, 0% 30%);
            transform: translateZ(0px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: background 0.8s ease;
        }

        .island-top.kurak {
            background: linear-gradient(135deg, #a16207 0%, #78350f 100%);
        }

        /* Ada Alt Toprak Kütlesi (Hacimli 3D Kesit) */
        .island-bottom {
            position: absolute;
            width: 220px;
            height: 220px;
            background: #451a03;
            clip-path: polygon(30% 0%, 70% 5%, 100% 30%, 95% 70%, 70% 100%, 30% 95%, 5% 70%, 0% 30%);
            transform: translateZ(-50px) scale(0.85);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            filter: brightness(0.7);
        }

        /* 3D Ağaç Konteyneri */
        .tree-3d-model {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(10px);
            width: 140px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        svg.poly-tree-svg {
            width: 150px;
            height: 170px;
            filter: drop-shadow(10px 18px 20px rgba(0,0,0,0.8));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tree-pop {
            animation: treeAnim 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes treeAnim {
            0% { transform: scale(0.5) translateZ(10px); opacity: 0.4; }
            70% { transform: scale(1.2) translateZ(40px); opacity: 1; }
            100% { transform: scale(1) translateZ(25px); opacity: 1; }
        }

        .tree-label {
            position: absolute;
            bottom: -20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: #6ee7b7;
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            transform: translateZ(35px);
        }

        .quote-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            text-align: center;
            font-style: italic;
            color: #34d399;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* Takvim Paneli */
        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
        .drawer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .drawer.open { max-height: 160px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 110px; overflow-y: auto; }
        .day-cell { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px; text-align: center; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-cell.active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: #64748b; }
        .dot.done { background: #34d399; }

        /* Görev Listesi */
        .tasks-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .tasks-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary-light); }
        .task-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--primary-light); cursor: pointer; }
        .task-texts { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .task-name { font-weight: 600; font-size: 0.88rem; color: #f1f5f9; }
        .task-desc { font-size: 0.72rem; color: #94a3b8; }

        footer { text-align: center; font-size: 0.72rem; color: #64748b; margin-top: 4px; }
        footer span { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="app-title">🏝️ 3D Low-Poly Manevi Ada</span>
        <span id="progressBadge" style="font-size: 0.8rem; font-weight: 700; background: rgba(16,185,129,0.2); padding: 4px 10px; border-radius: 20px; color: #34d399;">0 / 6 Tamamlandı</span>
    </header>

    <div class="quote-box" id="quoteBox">"Ada tamamen kurak toprakta... Low-poly ağacını büyütmek için görevleri tamamla."</div>

    <!-- 3D Sahne Alanı -->
    <div class="scene-container" id="sceneContainer">
        <div class="floating-island" id="floatingIsland">
            <div class="island-bottom"></div>
            <div class="island-top kurak" id="islandTop"></div>
            
            <!-- 3D Low-Poly Ağaç Model Alanı -->
            <div class="tree-3d-model">
                <svg id="polyTreeSvg" class="poly-tree-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dinamik 3D Low-Poly Ağaç Kesitleri -->
                </svg>
                <div class="tree-label" id="treeLabel">1. Aşama: Kurak Filiz</div>
            </div>
        </div>
    </div>

    <!-- Takvim Seçici -->
    <div class="calendar-card" onclick="toggleDrawer()">
        <div class="calendar-header">
            <span id="currentDateLabel">📅 16 Ağustos 2026</span>
            <span style="font-size: 0.75rem; color: #94a3b8;" id="drawerIcon">▼ Takvimi Aç</span>
        </div>
        <div class="drawer" id="calendarDrawer">
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- Görev Listesi -->
    <div class="tasks-card">
        <div class="tasks-title">
            <span>Günün Manevi Amelleri</span>
            <span style="color: #34d399;" id="completionPercent">%0</span>
        </div>

        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="0" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌅 Sabah Namazı</span><span class="task-desc">Toprağa ilk 3D low-poly filiz atıldı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="1" onchange="updateFarm()"><div class="task-texts"><span class="task-name">☀️ Öğle Namazı</span><span class="task-desc">Gövde 3D hacim kazandı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="2" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌤️ İkindi Namazı</span><span class="task-desc">Geometrik dallar uzadı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="3" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌇 Akşam Namazı</span><span class="task-desc">Low-poly yaprak kümeleri oluştu</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="4" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌙 Yatsı Namazı</span><span class="task-desc">Muazzam hacimli taç yapraklar</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="5" onchange="updateFarm()"><div class="task-texts"><span class="task-name">📿 Günlük Zikir & Dua</span><span class="task-desc">Meyvelerle donanan 3D zirve ağaç</span></div></div></label>
    </div>
</div>

<footer>Ayetin Vakti Ekosistemi • <span>3D Low-Poly Ada ve Ağaç Modeli</span></footer>

<script>
    let activeDay = 16;
    let activeMonth = 8;

    const scene = document.getElementById('sceneContainer');
    const island = document.getElementById('floatingIsland');
    
    scene.addEventListener('mousemove', (e) => {
        const rect = scene.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        island.style.transform = `rotateX(${55 - y / 7}deg) rotateZ(${-45 + x / 7}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
        island.style.transform = `rotateX(55deg) rotateZ(-45deg)`;
    });

    function toggleDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const icon = document.getElementById('drawerIcon');
        drawer.classList.toggle('open');
        icon.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        for (let d = 1; d <= 31; d++) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${d === activeDay ? 'active' : ''}`;
            const key = `poly3d_tree_${activeMonth}_${d}`;
            const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const count = data.filter(Boolean).length;
            
            cell.innerHTML = `<span>${d}</span><div class="dot ${count > 0 ? 'done' : ''}"></div>`;
            cell.onclick = () => { activeDay = d; initCalendar(); loadDay(); };
            grid.appendChild(cell);
        }
        loadDay();
    }

    function loadDay() {
        document.getElementById('currentDateLabel').innerText = `📅 ${activeDay} Ağustos 2026`;
        const key = `poly3d_tree_${activeMonth}_${activeDay}`;
        const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.task-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = data[idx]);
        render3DPolyTree(data, false);
    }

    function updateFarm() {
        const checkboxes = document.querySelectorAll('.task-checkbox');
        const data = Array.from(checkboxes).map(cb => cb.checked);
        const key = `poly3d_tree_${activeMonth}_${activeDay}`;
        localStorage.setItem(key, JSON.stringify(data));
        initCalendar();
        render3DPolyTree(data, true);
    }

    // Gerçek 3D Hacimli Low-Poly Ağaç Çizim Motoru
    function render3DPolyTree(data, animate = true) {
        const count = data.filter(Boolean).length;
        document.getElementById('progressBadge').innerText = `${count} / 6 Tamamlandı`;
        document.getElementById('completionPercent').innerText = `%${Math.round((count/6)*100)}`;

        const islandTop = document.getElementById('islandTop');
        if (count === 0) {
            islandTop.classList.add('kurak');
        } else {
            islandTop.classList.remove('kurak');
        }

        const svg = document.getElementById('polyTreeSvg');
        const labelEl = document.getElementById('treeLabel');
        const quoteEl = document.getElementById('quoteBox');

        if (animate) {
            svg.classList.remove('tree-pop');
            void svg.offsetWidth;
            svg.classList.add('tree-pop');
        }

        let svgContent = '';
        let labelText = '';
        let quoteText = '';

        // Gönderdiğin son görseldeki gibi hacimli, çok yüzeyli low-poly 3D nesneler
        if (count === 0) {
            // Aşama 0: Kurak Minik Kaya/Filiz Parçası
            svgContent = `
                <polygon points="95,135 110,130 105,155 90,150" fill="#78350f"/>
                <polygon points="95,135 102,125 110,130" fill="#b45309"/>
                <polygon points="102,125 105,155 110,130" fill="#92400e"/>`;
            labelText = "Kurak Ada Toprağı";
            quoteText = "Ada tamamen kurak toprakta... Low-poly ağacını büyütmek için görevleri tamamla.";
        } else if (count === 1) {
            // Aşama 1: İlk Filiz Gövde
            svgContent = `
                <polygon points="92,115 108,110 105,155 88,150" fill="#78350f"/>
                <polygon points="92,115 100,100 108,110" fill="#b45309"/>
                <polygon points="100,100 105,155 108,110" fill="#92400e"/>`;
            labelText = "1. Aşama: Filiz Gövde";
            quoteText = "Sabah bereketiyle ilk low-poly filiz adada yükseldi.";
        } else if (count === 2) {
            // Aşama 2: Uzayan Gövde
            svgContent = `
                <polygon points="90,90 110,85 106,155 86,150" fill="#78350f"/>
                <polygon points="90,90 100,75 110,85" fill="#b45309"/>
                <polygon points="100,75 106,155 110,85" fill="#92400e"/>
                <polygon points="100,75 104,85 112,80" fill="#d97706"/>`;
            labelText = "2. Aşama: Gövde Boy Veriyor";
            quoteText = "Öğle ibadetiyle gövde hacim kazandı ve uzadı.";
        } else if (count === 3) {
            // Aşama 3: Geometrik Dallar
            svgContent = `
                <polygon points="92,90 108,85 105,155 88,150" fill="#78350f"/>
                <polygon points="92,85 75,65 88,72" fill="#b45309"/>
                <polygon points="108,85 125,70 115,75" fill="#92400e"/>
                <polygon points="75,65 82,58 90,70" fill="#65a30d"/>
                <polygon points="125,70 118,63 112,72" fill="#65a30d"/>`;
            labelText = "3. Aşama: Dallar Filizleniyor";
            quoteText = "İkindi huzuruyla geometrik dallar yanlara doğru açıldı.";
        } else if (count === 4) {
            // Aşama 4: Low-Poly Yaprak Kümeleri Başlıyor
            svgContent = `
                <polygon points="92,90 108,85 105,155 88,150" fill="#78350f"/>
                <polygon points="70,60 90,40 105,65 85,75" fill="#15803d"/>
                <polygon points="105,55 125,35 140,60 120,75" fill="#22c55e"/>
                <polygon points="85,35 105,20 120,45 100,55" fill="#16a34a"/>`;
            labelText = "4. Aşama: Yaprak Kümeleri Oluşuyor";
            quoteText = "Akşam yaklaşırken low-poly çok yüzeyli yapraklar belirginleşti.";
        } else if (count === 5) {
            // Aşama 5: Geniş Low-Poly Taç Yapı
            svgContent = `
                <polygon points="90,85 110,80 105,155 85,150" fill="#78350f"/>
                <polygon points="65,65 45,45 70,30 95,55" fill="#15803d"/>
                <polygon points="105,55 130,35 155,55 130,75" fill="#16a34a"/>
                <polygon points="75,40 100,15 125,40 100,60" fill="#22c55e"/>
                <polygon points="85,30 115,25 125,50 95,50" fill="#4ade80"/>`;
            labelText = "5. Aşama: Muazzam Ulu Ağaç Tacı";
            quoteText = "Yatsı huzuruyla ağaç tam bir low-poly sanat eserine dönüştü.";
        } else if (count === 6) {
            // Aşama 6: Meyveli 3D Zirve Ağaç (Son Görseldeki Gibi)
            svgContent = `
                <polygon points="90,85 110,80 105,155 85,150" fill="#78350f"/>
                <polygon points="65,65 45,45 70,30 95,55" fill="#15803d"/>
                <polygon points="105,55 130,35 155,55 130,75" fill="#16a34a"/>
                <polygon points="75,40 100,15 125,40 100,60" fill="#22c55e"/>
                <polygon points="85,30 115,25 125,50 95,50" fill="#4ade80"/>
                <!-- Low-Poly 3D Geometrik Meyveler -->
                <polygon points="68,45 74,40 78,48 70,52" fill="#ef4444"/>
                <polygon points="115,35 122,30 126,38 118,42" fill="#ef4444"/>
                <polygon points="95,25 101,20 105,28 98,32" fill="#eab308"/>
                <polygon points="135,50 141,45 145,53 138,57" fill="#ef4444"/>
                <polygon points="80,55 86,50 90,58 83,62" fill="#eab308"/>`;
            labelText = "Zirve: Meyveli 3D Ulu Ağaç";
            quoteText = "✨ Elhamdülillah! Tüm ibadetler tamamlandı; 3D low-poly manevi ağacın meyveleriyle ada berekete büründü.";
        }

        svg.innerHTML = svgContent;
        labelEl.innerText = labelText;
        quoteEl.innerText = quoteText;
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });
</script>
</body>
</html>
