<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Low-Poly Ada ve Ağaç Simülasyonu</title>
    <style>
        :root {
            --primary: #059669;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #064e3b 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 3D Sahne Alanı (Gün Batımı Atmosferi) */
        .scene-container {
            width: 100%;
            height: 380px;
            background: linear-gradient(to bottom, #fde047 0%, #fed7aa 40%, #ffedd5 75%, #e2e8f0 100%);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Gökyüzü Low-Poly Bulutları */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: floatCloud 6s ease-in-out infinite alternate;
        }
        .cloud-1 { width: 65px; height: 20px; top: 35px; left: 60px; }
        .cloud-2 { width: 85px; height: 24px; top: 20px; right: 80px; animation-delay: 1.5s; }
        .cloud-3 { width: 55px; height: 18px; top: 60px; left: 180px; animation-delay: 3s; }

        @keyframes floatCloud {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-5px) scale(1.02); }
        }

        /* Havada Süzülen 3D Low-Poly Ada */
        .floating-island {
            width: 290px;
            height: 290px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(22deg) rotateZ(-12deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ada Üst Yeşil Katman */
        .island-top {
            position: absolute;
            width: 270px;
            height: 230px;
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            clip-path: polygon(30% 15%, 70% 10%, 92% 35%, 88% 75%, 65% 92%, 30% 88%, 12% 65%, 15% 30%);
            transform: translateY(35px);
            box-shadow: inset 0 -15px 25px rgba(0,0,0,0.25);
            transition: background 0.8s ease;
        }

        .island-top.kurak {
            background: linear-gradient(135deg, #d97706 0%, #92400e 100%);
        }

        /* Ada Alt Toprak Kütlesi (Hacimli Derinlik) */
        .island-bottom {
            position: absolute;
            width: 270px;
            height: 230px;
            background: #361502;
            clip-path: polygon(30% 15%, 70% 10%, 92% 35%, 88% 75%, 65% 92%, 30% 88%, 12% 65%, 15% 30%);
            transform: translateY(70px) scale(0.92);
            filter: brightness(0.55);
            box-shadow: 0 40px 70px rgba(0,0,0,0.8);
        }

        /* Ağaç Konteyneri */
        .tree-container {
            position: absolute;
            bottom: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        svg.main-tree-svg {
            width: 230px;
            height: 230px;
            filter: drop-shadow(6px 14px 18px rgba(0,0,0,0.4));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tree-pop {
            animation: treeAnim 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes treeAnim {
            0% { transform: scale(0.6); opacity: 0.3; }
            70% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .tree-label {
            position: absolute;
            bottom: -15px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: #6ee7b7;
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
        }

        .quote-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            text-align: center;
            font-style: italic;
            color: #10b981;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* Takvim Paneli */
        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
        .drawer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .drawer.open { max-height: 160px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 110px; overflow-y: auto; }
        .day-cell { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px; text-align: center; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-cell.active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: #64748b; }
        .dot.done { background: #34d399; }

        /* Görev Listesi */
        .tasks-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .tasks-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: 700; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary-light); }
        .task-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--primary-light); cursor: pointer; }
        .task-texts { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .task-name { font-weight: 600; font-size: 0.88rem; color: #f1f5f9; }
        .task-desc { font-size: 0.72rem; color: #94a3b8; }

        footer { text-align: center; font-size: 0.72rem; color: #64748b; margin-top: 4px; }
        footer span { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="app-title">🏝️ Low-Poly Ada ve Ağaç</span>
        <span id="progressBadge" style="font-size: 0.8rem; font-weight: 700; background: rgba(16,185,129,0.2); padding: 4px 10px; border-radius: 20px; color: #34d399;">0 / 6 Tamamlandı</span>
    </header>

    <div class="quote-box" id="quoteBox">"Ada toprakları kurak... Ağacı büyütmek için görevleri tamamla."</div>

    <!-- 3D Sahne Alanı -->
    <div class="scene-container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

        <div class="floating-island">
            <div class="island-bottom"></div>
            <div class="island-top kurak" id="islandTop"></div>
            
            <!-- Hedef Görselle Birebir Low-Poly Ağaç Model Motoru -->
            <div class="tree-container">
                <svg id="mainTreeSvg" class="main-tree-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#78350f"/>
                            <stop offset="50%" stop-color="#b45309"/>
                            <stop offset="100%" stop-color="#451a03"/>
                        </linearGradient>
                        <radialGradient id="leafGrad1" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#86efac"/>
                            <stop offset="60%" stop-color="#22c55e"/>
                            <stop offset="100%" stop-color="#15803d"/>
                        </radialGradient>
                        <radialGradient id="leafGrad2" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#4ade80"/>
                            <stop offset="60%" stop-color="#16a34a"/>
                            <stop offset="100%" stop-color="#14532d"/>
                        </radialGradient>
                    </defs>
                </svg>
                <div class="tree-label" id="treeLabel">Kurak Toprak</div>
            </div>
        </div>
    </div>

    <!-- Takvim Seçici -->
    <div class="calendar-card" onclick="toggleDrawer()">
        <div class="calendar-header">
            <span id="currentDateLabel">📅 16 Ağustos 2026</span>
            <span style="font-size: 0.75rem; color: #94a3b8;" id="drawerIcon">▼ Takvimi Aç</span>
        </div>
        <div class="drawer" id="calendarDrawer">
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- Görev Listesi -->
    <div class="tasks-card">
        <div class="tasks-title">
            <span>Günün Manevi Amelleri</span>
            <span style="color: #34d399;" id="completionPercent">%0</span>
        </div>

        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="0" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌅 Sabah Namazı</span><span class="task-desc">Toprak yeşermeye başladı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="1" onchange="updateFarm()"><div class="task-texts"><span class="task-name">☀️ Öğle Namazı</span><span class="task-desc">Ağacın ana gövdesi yükseldi</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="2" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌤️ İkindi Namazı</span><span class="task-desc">Dallar kollara ayrıldı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="3" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌇 Akşam Namazı</span><span class="task-desc">Low-poly küre yapraklar oluştu</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="4" onchange="updateFarm()"><div class="task-texts"><span class="task-name">🌙 Yatsı Namazı</span><span class="task-desc">Geniş yaprak tacı tamamlandı</span></div></div></label>
        <label class="task-item"><div class="task-info"><input type="checkbox" class="task-checkbox" data-idx="5" onchange="updateFarm()"><div class="task-texts"><span class="task-name">📿 Günlük Zikir & Dua</span><span class="task-desc">Ulu ağaç meyvelerle donandı</span></div></div></label>
    </div>
</div>

<footer>Ayetin Vakti Ekosistemi • <span>Low-Poly Stil Tam Uyum</span></footer>

<script>
    let activeDay = 16;
    let activeMonth = 8;

    function toggleDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const icon = document.getElementById('drawerIcon');
        drawer.classList.toggle('open');
        icon.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        for (let d = 1; d <= 31; d++) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${d === activeDay ? 'active' : ''}`;
            const key = `exact_tree_v2_${activeMonth}_${d}`;
            const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const count = data.filter(Boolean).length;
            
            cell.innerHTML = `<span>${d}</span><div class="dot ${count > 0 ? 'done' : ''}"></div>`;
            cell.onclick = () => { activeDay = d; initCalendar(); loadDay(); };
            grid.appendChild(cell);
        }
        loadDay();
    }

    function loadDay() {
        document.getElementById('currentDateLabel').innerText = `📅 ${activeDay} Ağustos 2026`;
        const key = `exact_tree_v2_${activeMonth}_${activeDay}`;
        const data = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.task-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = data[idx]);
        renderTree(data, false);
    }

    function updateFarm() {
        const checkboxes = document.querySelectorAll('.task-checkbox');
        const data = Array.from(checkboxes).map(cb => cb.checked);
        const key = `exact_tree_v2_${activeMonth}_${activeDay}`;
        localStorage.setItem(key, JSON.stringify(data));
        initCalendar();
        renderTree(data, true);
    }

    // Hedef Görselle Birebir Uyumlu Low-Poly Çizim Motoru
    function renderTree(data, animate = true) {
        const count = data.filter(Boolean).length;
        document.getElementById('progressBadge').innerText = `${count} / 6 Tamamlandı`;
        document.getElementById('completionPercent').innerText = `%${Math.round((count/6)*100)}`;

        const islandTop = document.getElementById('islandTop');
        if (count === 0) {
            islandTop.classList.add('kurak');
        } else {
            islandTop.classList.remove('kurak');
        }

        const svg = document.getElementById('mainTreeSvg');
        const labelEl = document.getElementById('treeLabel');
        const quoteEl = document.getElementById('quoteBox');

        if (animate) {
            svg.classList.remove('tree-pop');
            void svg.offsetWidth;
            svg.classList.add('tree-pop');
        }

        let defsHTML = svg.querySelector('defs').outerHTML;
        let svgContent = '';
        let labelText = '';
        let quoteText = '';

        if (count === 0) {
            svgContent = `<polygon points="95,140 105,135 102,155 92,150" fill="url(#trunkGrad)"/>`;
            labelText = "Kurak Toprak";
            quoteText = "Ada toprakları kurak... Ağacı büyütmek için görevleri tamamla.";
        } else if (count === 1) {
            svgContent = `<path d="M 94 150 Q 98 120 100 95 Q 103 120 107 150 Z" fill="url(#trunkGrad)"/>`;
            labelText = "1. Aşama: Filiz";
            quoteText = "Sabah bereketiyle filiz yükseldi.";
        } else if (count === 2) {
            svgContent = `
                <path d="M 92 150 Q 97 115 100 85 Q 104 115 110 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 100 110 L 72 88" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
                <path d="M 100 105 L 128 85" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>`;
            labelText = "2. Aşama: Gövde ve Kolları";
            quoteText = "Öğle ibadetiyle dallar belirginleşti.";
        } else if (count === 3) {
            svgContent = `
                <path d="M 92 150 Q 97 115 100 80 Q 104 115 110 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 100 105 C 75 92 48 70 36 48" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
                <path d="M 100 95 C 128 88 152 68 164 48" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
                <polygon points="30,42 55,28 65,52 40,62" fill="url(#leafGrad1)"/>
                <polygon points="135,40 162,32 170,58 142,65" fill="url(#leafGrad2)"/>`;
            labelText = "3. Aşama: Dallar ve Yapraklar";
            quoteText = "İkindi huzuruyla dallar etrafa yayıldı.";
        } else if (count === 4) {
            svgContent = `
                <path d="M 90 150 Q 96 110 100 70 Q 105 110 112 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 100 100 C 70 85 42 62 32 40" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
                <path d="M 100 90 C 130 82 158 60 168 38" stroke="#b45309" stroke-width="10" stroke-linecap="round"/>
                <!-- Hedef Görseldeki Low-Poly Çok Yüzeyli Küreler -->
                <polygon points="22,45 52,20 80,45 50,70" fill="url(#leafGrad1)" filter="drop-shadow(4px 6px 5px rgba(0,0,0,0.4))"/>
                <polygon points="120,38 150,18 178,42 148,68" fill="url(#leafGrad2)" filter="drop-shadow(4px 6px 5px rgba(0,0,0,0.4))"/>
                <polygon points="68,22 104,5 136,35 100,55" fill="url(#leafGrad1)" filter="drop-shadow(4px 6px 5px rgba(0,0,0,0.4))"/>`;
            labelText = "4. Aşama: Küresel Low-Poly Yapraklar";
            quoteText = "Akşam yaklaşırken hedeflenen o hacimli küre yapılar oluştu.";
        } else if (count === 5) {
            svgContent = `
                <path d="M 90 150 Q 96 110 100 70 Q 105 110 112 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 100 100 C 70 85 42 62 32 40" stroke="#78350f" stroke-width="11" stroke-linecap="round"/>
                <path d="M 100 90 C 130 82 158 60 168 38" stroke="#b45309" stroke-width="11" stroke-linecap="round"/>
                <path d="M 100 80 C 102 60 104 42 100 22" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
                <!-- Geniş ve Dolgun Low-Poly Küre Tacı -->
                <polygon points="20,42 50,18 78,42 48,68" fill="url(#leafGrad1)" filter="drop-shadow(5px 7px 6px rgba(0,0,0,0.45))"/>
                <polygon points="122,35 152,15 180,40 150,65" fill="url(#leafGrad2)" filter="drop-shadow(5px 7px 6px rgba(0,0,0,0.45))"/>
                <polygon points="65,18 102,2 134,32 98,52" fill="url(#leafGrad1)" filter="drop-shadow(5px 7px 6px rgba(0,0,0,0.45))"/>
                <polygon points="85,32 115,18 142,48 112,65" fill="url(#leafGrad2)" filter="drop-shadow(3px 4px 4px rgba(0,0,0,0.3))"/>`;
            labelText = "5. Aşama: Geniş Ağaç Tacı";
            quoteText = "Yatsı huzuruyla ağaç tam formuna ulaştı.";
        } else if (count === 6) {
            svgContent = `
                <path d="M 90 150 Q 96 110 100 70 Q 105 110 112 150 Z" fill="url(#trunkGrad)"/>
                <path d="M 100 100 C 70 85 42 62 32 40" stroke="#78350f" stroke-width="11" stroke-linecap="round"/>
                <path d="M 100 90 C 130 82 158 60 168 38" stroke="#b45309" stroke-width="11" stroke-linecap="round"/>
                <path d="M 100 80 C 102 60 104 42 100 22" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
                <!-- Geniş ve Dolgun Low-Poly Küre Tacı -->
                <polygon points="20,42 50,18 78,42 48,68" fill="url(#leafGrad1)" filter="drop-shadow(5px 7px 6px rgba(0,0,0,0.45))"/>
                <polygon points="122,35 152,15 180,40 150,65" fill="url(#leafGrad2)" filter="drop-shadow(5px 7px 6px rgba(0,0,0,0.45))"/>
                <polygon points="65,18 102,2 134,32 98,52" fill="url(#leafGrad1)" filter="drop-shadow(5px 7px 6px rgba(0,0,0,0.45))"/>
                <polygon points="85,32 115,18 142,48 112,65" fill="url(#leafGrad2)" filter="drop-shadow(3px 4px 4px rgba(0,0,0,0.3))"/>
                <!-- Hedef Resimdeki Kırmızı Low-Poly Meyveler -->
                <polygon points="38,32 46,28 50,36 42,41" fill="#ef4444"/>
                <polygon points="142,28 150,24 154,32 146,37" fill="#ef4444"/>
                <polygon points="95,14 103,10 107,18 99,23" fill="#ef4444"/>
                <polygon points="112,42 120,38 124,46 116,51" fill="#ef4444"/>
                <polygon points="58,50 66,46 70,54 62,59" fill="#ef4444"/>
                <polygon points="158,35 166,31 170,39 162,44" fill="#ef4444"/>`;
            labelText = "✨ Zirve: Hedef Görselle Birebir Ulu Ağaç";
            quoteText = "Elhamdülillah! İstediğin o low-poly hacim ve detaylar eksiksiz işlendi.";
        }

        svg.innerHTML = defsHTML + svgContent;
        labelEl.innerText = labelText;
        quoteEl.innerText = quoteText;
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });
</script>
</body>
</html>
