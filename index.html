<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manevi Tarım & İbadet Takvimi | Ayetin Vakti</title>
    <meta name="theme-color" content="#10b981">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
            
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }
        })();
    </script>

    <style>
        :root {
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #fef08a 0%, #a7f3d0 50%, #38bdf8 100%);
            background-size: 300% 300%;
            animation: skyAnim 15s ease infinite;
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 14px; 
            transition: 0.3s; 
            position: relative;
            overflow-x: hidden;
        }

        @keyframes skyAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; z-index: 2; }
        
        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
        .back-btn { background: rgba(255,255,255,0.7); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.9); color: #0f172a; font-size: 1.4rem; cursor: pointer; text-decoration: none; font-weight: bold; backdrop-filter: blur(5px); }
        .app-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; font-family: 'Georgia', serif; text-align: center; text-shadow: 0 2px 4px rgba(255,255,255,0.4); }

        #spiritQuote { 
            min-height: 38px; 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 6px 12px;
            font-style: italic; 
            font-size: 0.8rem; 
            color: #065f46; 
            text-align: center; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.4s; 
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        /* İzometrik 3D Çiftlik Sahnesi */
        .farm-viewport {
            width: 100%;
            height: 270px;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .isometric-island {
            width: 320px;
            height: 220px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(55deg) rotateZ(-45deg);
            transition: transform 0.4s ease;
        }

        /* Çiftlik Katmanları ve Alanları */
        .farm-tile {
            position: absolute;
            border-radius: 8px;
            transition: 0.4s;
        }

        /* Toprak/Çimen Zemin Tabanı */
        .base-ground {
            width: 280px;
            height: 280px;
            background: #d4d4d8;
            border-radius: 16px;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.5s;
        }

        /* Etkileşimli Ekin Tarlaları */
        .plot-1 { width: 110px; height: 65px; top: 20px; left: 20px; background: #a18053; border: 2px dashed #785834; }
        .plot-2 { width: 110px; height: 65px; top: 105px; left: 20px; background: #a18053; border: 2px dashed #785834; }
        
        /* Çiftlik Evi ve Ağaç Bölgesi */
        .farm-house {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 75px;
            height: 60px;
            background: #ef4444;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: -5px 5px 15px rgba(0,0,0,0.3);
        }

        /* Ağaçlar ve Çocuk Alanı */
        .tree-zone {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 110px;
            height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .farm-element {
            font-size: 1.5rem;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4);
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        .pop-anim {
            animation: elementPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;
        }

        @keyframes elementPop {
            0% { transform: scale(0.2) translateZ(20px); opacity: 0; }
            70% { transform: scale(1.3) translateZ(40px); opacity: 1; }
            100% { transform: scale(1) translateZ(10px); opacity: 1; }
        }

        .compact-date-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        }
        .date-display-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; color: #0f172a; }
        
        .calendar-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0 0 14px 14px;
            padding: 0 14px;
        }
        .calendar-drawer.open { max-height: 180px; padding: 10px 14px 14px 14px; border-top: 1px solid #e2e8f0; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-height: 120px; overflow-y: auto; }
        .day-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 2px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-box.active { border-color: #eab308; background: #fffbeb; box-shadow: 0 0 6px rgba(234, 179, 8, 0.4); }
        .day-num { font-size: 0.7rem; font-weight: 700; color: #334155; }
        .day-dot { width: 4px; height: 4px; border-radius: 50%; background: #cbd5e1; }
        .day-dot.completed { background: #10b981; }

        .card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 16px; 
            padding: 12px 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .section-title { font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }

        .ibadet-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: rgba(248, 250, 252, 0.8); border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.2s; user-select: none; }
        .ibadet-item:hover { border-color: var(--accent-color); background: #ffffff; }
        .ibadet-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .ibadet-checkbox { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }
        .ibadet-text-group { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .ibadet-name { font-weight: 600; font-size: 0.88rem; color: #0f172a; }
        .ibadet-desc { font-size: 0.72rem; color: #64748b; font-weight: 500; }

        .footer { margin: 2px 0 10px 0; text-align: center; font-size: 0.72rem; color: #334155; font-weight: 500; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
        .footer span { color: #047857; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="http://ayetinvakti.github.io" class="back-btn">‹</a>
        <span class="app-title">🌱 Manevi Tarım & İbadet</span>
        <div style="width: 36px;"></div>
    </header>

    <div id="spiritQuote">"Bismillah de, kurak tarlanı canlandırmaya başla..."</div>

    <!-- İzometrik 3D Çiftlik Sahnesi -->
    <div class="farm-viewport">
        <div class="isometric-island" id="isometricIsland">
            <!-- Zemin Tabanı (İbadete göre sarıdan canlı yeşile döner) -->
            <div class="base-ground" id="baseGround"></div>

            <!-- Sol Üst Tarlalar -->
            <div class="farm-tile plot-1" id="plot1Container" style="display: flex; align-items: center; justify-content: space-around; padding: 5px;"></div>
            <div class="farm-tile plot-2" id="plot2Container" style="display: flex; align-items: center; justify-content: space-around; padding: 5px;"></div>

            <!-- Çiftlik Evi -->
            <div class="farm-house" id="farmHouse">🏠</div>

            <!-- Sağ Alt Ağaçlar ve Çocukların Oyun Alanı -->
            <div class="tree-zone" id="treeZoneContainer"></div>
        </div>
    </div>

    <div style="background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.8);">
        <div class="compact-date-card" onclick="toggleCalendarDrawer()">
            <div class="date-display-info">
                <span>📅</span>
                <span id="selectedDateText">Ağustos 2026</span>
            </div>
            <span style="font-size: 0.8rem; color: #64748b;" id="drawerArrow">▼ Takvimi Aç</span>
        </div>
        <div class="calendar-drawer" id="calendarDrawer">
            <div style="margin-bottom: 8px; display: flex; justify-content: flex-end;">
                <select id="monthSelect" onchange="changeMonth()" style="padding: 3px 8px; font-size: 0.78rem; border-radius: 6px; border: 1px solid #cbd5e1; background:#f1f5f9;">
                    <option value="0">Ocak</option><option value="1">Şubat</option><option value="2">Mart</option>
                    <option value="3">Nisan</option><option value="4">Mayıs</option><option value="5">Haziran</option>
                    <option value="6">Temmuz</option><option value="7" selected>Ağustos</option><option value="8">Eylül</option>
                    <option value="9">Ekim</option><option value="10">Kasım</option><option value="11">Aralık</option>
                </select>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span id="dailyCardTitle">Günün Amelleri</span>
            <span id="completionRate" style="color: var(--accent-color);">0/6</span>
        </div>
        
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="0" onchange="handleIbadetChange(0, '🌅 Sabah serinliğiyle kurak toprak can suyu aldı, ilk filizler yeşerdi.')"><div class="ibadet-text-group"><span class="ibadet-name">🌅 Sabah Namazı</span><span class="ibadet-desc">Günün ilk tohumu</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="1" onchange="handleIbadetChange(1, '☀️ Öğle vaktinde tarladaki ekinler boy atmaya başladı.')"><div class="ibadet-text-group"><span class="ibadet-name">☀️ Öğle Namazı</span><span class="ibadet-desc">Gündüzün orta yerinde sulama</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="2" onchange="handleIbadetChange(2, '🌤️ İkindi vakti minik meyve ağaçları filizlenip büyüdü.')"><div class="ibadet-text-group"><span class="ibadet-name">🌤️ İkindi Namazı</span><span class="ibadet-desc">Ömrün ikindisinde sebat</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="3" onchange="handleIbadetChange(3, '🌇 Akşam huzuruyla ev şenlendi, çocuklar bahçede oynamaya başladı.')"><div class="ibadet-text-group"><span class="ibadet-name">🌇 Akşam Namazı</span><span class="ibadet-desc">Hüznü geride bırakıp ürüne yöneliş</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="4" onchange="handleIbadetChange(4, '🌙 Yatsı sükunetinde ağaçlar meyveyle doldu, tarlalar başak verdi.')"><div class="ibadet-text-group"><span class="ibadet-name">🌙 Yatsı Namazı</span><span class="ibadet-desc">Gece sükunetinde tarlanın koruması</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="5" onchange="handleIbadetChange(5, '✨📿 Zirve Hasat: Zikir bereketiyle tüm çiftlik altın sarısı berekete ve neşeye boğuldu!')"><div class="ibadet-text-group"><span class="ibadet-name">📿 Günlük Zikir & Dua</span><span class="ibadet-desc">"Sübhanallahi ve bihamdihi" ile bereket</span></div></div></label>
    </div>
</div>

<div class="footer">Ayetin Vakti Ekosistemi • <span>Adım Adım Manevi Hasat</span></div>

<script>
    let currentMonth = new Date().getMonth();
    let selectedDay = new Date().getDate();
    const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    function toggleCalendarDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const arrow = document.getElementById('drawerArrow');
        drawer.classList.toggle('open');
        arrow.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        const totalDays = monthDays[currentMonth];
        for (let d = 1; d <= totalDays; d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box' + (d === selectedDay ? ' active' : '');
            const key = `manevi_tarla_${currentMonth}_${d}`;
            const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const completedCount = savedData.filter(Boolean).length;
            dayBox.innerHTML = `<span class="day-num">${d}</span><div class="day-dot ${completedCount > 0 ? 'completed' : ''}" style="opacity: ${completedCount > 0 ? 1 : 0.3}"></div>`;
            dayBox.onclick = () => { selectedDay = d; initCalendar(); loadDayData(); };
            grid.appendChild(dayBox);
        }
        loadDayData();
    }

    function changeMonth() {
        currentMonth = parseInt(document.getElementById('monthSelect').value);
        selectedDay = 1;
        initCalendar();
    }

    function loadDayData() {
        const key = `manevi_tarla_${currentMonth}_${selectedDay}`;
        const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = savedData[idx]);
        document.getElementById('selectedDateText').innerText = `${selectedDay} ${monthNames[currentMonth]} 2026`;
        document.getElementById('dailyCardTitle').innerText = `${selectedDay} ${monthNames[currentMonth]} Amelleri`;
        updateIsometricFarm(savedData, false);
    }

    function handleIbadetChange(index, quoteText) {
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        let data = Array.from(checkboxes).map(cb => cb.checked);
        document.getElementById('spiritQuote').innerText = checkboxes[index].checked ? quoteText : "Tarlanı canlandırmak için ibadetlerini tamamla...";
        localStorage.setItem(`manevi_tarla_${currentMonth}_${selectedDay}`, JSON.stringify(data));
        initCalendar();
        updateIsometricFarm(data, true);
    }

    function updateIsometricFarm(data, animate = false) {
        const count = data.filter(Boolean).length;
        document.getElementById('completionRate').innerText = `${count}/6`;

        // Zemin rengi: 0'da sararmış/kurak toprak, arttıkça canlı çim yeşiline dönüyor
        const baseGround = document.getElementById('baseGround');
        if (count === 0) {
            baseGround.style.background = '#e7e5e4'; // Sararmış kurak zemin
        } else if (count < 4) {
            baseGround.style.background = '#84cc16'; // Filizlenen yeşil
        } else {
            baseGround.style.background = '#22c55e'; // Canlı bereketli yeşil
        }

        // Tarlalar (1 ve 2. plot)
        const plot1 = document.getElementById('plot1Container');
        const plot2 = document.getElementById('plot2Container');
        plot1.innerHTML = '';
        plot2.innerHTML = '';

        let cropIcon = count === 0 ? "🟤" : (count < 3 ? "🌱" : (count < 6 ? "🌿" : "🌾"));
        for(let i=0; i<3; i++) {
            let el1 = document.createElement('div');
            el1.className = 'farm-element' + (animate ? ' pop-anim' : '');
            el1.innerText = cropIcon;
            plot1.appendChild(el1);

            let el2 = document.createElement('div');
            el2.className = 'farm-element' + (animate ? ' pop-anim' : '');
            el2.innerText = cropIcon;
            plot2.appendChild(el2);
        }

        // Ağaçlar ve Çocukların Sevinci (Sağ Alt Alan)
        const treeZone = document.getElementById('treeZoneContainer');
        treeZone.innerHTML = '';

        // İbadet arttıkça ağaçlar büyür ve çocuklar eklenir
        let elementsToDisplay = [];
        if (count >= 1) elementsToDisplay.push("🌳");
        if (count >= 2) elementsToDisplay.push("🍎");
        if (count >= 3) elementsToDisplay.push("🌳");
        if (count >= 4) elementsToDisplay.push("👦"); // Çocukların sevinci
        if (count >= 5) elementsToDisplay.push("👧"); // Neşe
        if (count >= 6) elementsToDisplay.push("🌟");

        elementsToDisplay.forEach(icon => {
            let item = document.createElement('div');
            item.className = 'farm-element' + (animate ? ' pop-anim' : '');
            item.innerText = icon;
            treeZone.appendChild(item);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('monthSelect').value = currentMonth;
        initCalendar();
    });
</script>
</body>
</html>
