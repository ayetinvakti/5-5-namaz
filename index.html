<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manevi Tarım & İbadet Takvimi | Ayetin Vakti</title>
    <meta name="theme-color" content="#10b981">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
            
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }
        })();
    </script>

    <style>
        :root {
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Fotoğraftaki Gibi Bulutlu ve Ferah Gökyüzü Arka Planı */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(180deg, #93c5fd 0%, #cbd5e1 45%, #f1f5f9 100%);
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 14px; 
            transition: 0.3s; 
            position: relative;
            overflow-x: hidden;
        }

        /* Yavaşça süzülen gerçekçi gökyüzü bulutları */
        .sky-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 100px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03));
            animation: driftCloud 25s linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        .sky-cloud::before, .sky-cloud::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.7); border-radius: 50%; }
        
        .sc1 { width: 140px; height: 40px; top: 15px; left: -150px; animation-duration: 30s; }
        .sc1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .sc1::after { width: 50px; height: 50px; top: -20px; left: 70px; }

        .sc2 { width: 180px; height: 50px; top: 45px; left: -200px; animation-duration: 45s; animation-delay: 10s; opacity: 0.8; }
        .sc2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .sc2::after { width: 60px; height: 60px; top: -25px; left: 90px; }

        @keyframes driftCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 300px)); }
        }

        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; z-index: 2; }
        
        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
        .back-btn { background: rgba(255,255,255,0.6); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.8); color: #0f172a; font-size: 1.4rem; cursor: pointer; text-decoration: none; font-weight: bold; backdrop-filter: blur(5px); }
        .app-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; font-family: 'Georgia', serif; text-align: center; text-shadow: 0 2px 4px rgba(255,255,255,0.4); }

        #spiritQuote { 
            min-height: 38px; 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 6px 12px;
            font-style: italic; 
            font-size: 0.8rem; 
            color: #065f46; 
            text-align: center; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.4s; 
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        /* Ufka Giden Perspektif Tarla Görünümü (Fotoğraftaki Açı) */
        .field-viewport {
            width: 100%;
            height: 250px;
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 2px solid rgba(255,255,255,0.8);
            background: #2b1808;
            perspective: 600px;
        }

        .field-3d-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .field-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Tarlanın Üzerindeki Dinamik Ekin Konteyneri */
        .crops-overlay {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }

        .crop-row-item {
            font-size: 1.8rem;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .pop-animation {
            animation: cropPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;
        }

        @keyframes cropPop {
            0% { transform: scale(0.3) translateY(20px); opacity: 0; }
            70% { transform: scale(1.3) translateY(-8px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .compact-date-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        }
        .date-display-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; color: #0f172a; }
        
        .calendar-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0 0 14px 14px;
            padding: 0 14px;
        }
        .calendar-drawer.open { max-height: 180px; padding: 10px 14px 14px 14px; border-top: 1px solid #e2e8f0; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-height: 120px; overflow-y: auto; }
        .day-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 2px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-box.active { border-color: #eab308; background: #fffbeb; box-shadow: 0 0 6px rgba(234, 179, 8, 0.4); }
        .day-num { font-size: 0.7rem; font-weight: 700; color: #334155; }
        .day-dot { width: 4px; height: 4px; border-radius: 50%; background: #cbd5e1; }
        .day-dot.completed { background: #10b981; }

        .card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 16px; 
            padding: 12px 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .section-title { font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }

        .ibadet-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: rgba(248, 250, 252, 0.8); border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.2s; user-select: none; }
        .ibadet-item:hover { border-color: var(--accent-color); background: #ffffff; }
        .ibadet-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .ibadet-checkbox { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }
        .ibadet-text-group { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .ibadet-name { font-weight: 600; font-size: 0.88rem; color: #0f172a; }
        .ibadet-desc { font-size: 0.72rem; color: #64748b; font-weight: 500; }

        .footer { margin: 2px 0 10px 0; text-align: center; font-size: 0.72rem; color: #334155; font-weight: 500; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
        .footer span { color: #047857; font-weight: 700; }
    </style>
</head>
<body>

<div class="sky-cloud sc1"></div>
<div class="sky-cloud sc2"></div>

<div class="container">
    <header class="navbar">
        <a href="http://ayetinvakti.github.io" class="back-btn">‹</a>
        <span class="app-title">🌱 Manevi Tarım & İbadet</span>
        <div style="width: 36px;"></div>
    </header>

    <div id="spiritQuote">"Bismillah de, uçsuz bucaksız tarlanı ekmeye başla..."</div>

    <!-- Ufka Giden Perspektif Tarla Alanı -->
    <div class="field-viewport" id="fieldViewport">
        <div class="field-3d-scene" id="fieldScene">
            <svg class="field-svg" viewBox="0 0 400 250" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#bfdbfe"/>
                        <stop offset="60%" stop-color="#e2e8f0"/>
                        <stop offset="100%" stop-color="#f8fafc"/>
                    </linearGradient>
                    <linearGradient id="soilRowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#451a03"/>
                        <stop offset="100%" stop-color="#180b02"/>
                    </linearGradient>
                </defs>

                <!-- Gökyüzü Kısmı -->
                <rect x="0" y="0" width="400" height="110" fill="url(#skyGrad)"/>
                
                <!-- Ufuk Çizgisi Detayı -->
                <line x1="0" y1="110" x2="400" y2="110" stroke="#cbd5e1" stroke-width="1.5"/>

                <!-- Tarla Zemin Gövdesi -->
                <polygon points="0,110 400,110 400,250 0,250" fill="#2d1506"/>

                <!-- Ufka Doğru Yakınlaşan Perspektif Sıra Karıklar (Çizgiler) -->
                <!-- Merkezden dışa doğru yayılan hatlar -->
                <g stroke="#1a0c03" stroke-width="2" opacity="0.85">
                    <line x1="200" y1="110" x2="200" y2="250" stroke-width="5" stroke="#3b1705"/>
                    <line x1="200" y1="110" x2="160" y2="250"/>
                    <line x1="200" y1="110" x2="120" y2="250"/>
                    <line x1="200" y1="110" x2="70" y2="250"/>
                    <line x1="200" y1="110" x2="10" y2="250"/>
                    
                    <line x1="200" y1="110" x2="240" y2="250"/>
                    <line x1="200" y1="110" x2="280" y2="250"/>
                    <line x1="200" y1="110" x2="330" y2="250"/>
                    <line x1="200" y1="110" x2="390" y2="250"/>
                </g>

                <!-- Ekinlerin Sıra Sıra Işıltılı Yeşil Dokusu (Perspektif Efekti) -->
                <g fill="#15803d" opacity="0.9">
                    <!-- Ön sıralar daha büyük, arkaya doğru küçülüyor -->
                    <ellipse cx="200" cy="235" rx="14" ry="7" fill="#22c55e"/>
                    <ellipse cx="165" cy="230" rx="12" ry="6" fill="#22c55e"/>
                    <ellipse cx="235" cy="230" rx="12" ry="6" fill="#22c55e"/>
                    <ellipse cx="130" cy="225" rx="10" ry="5" fill="#16a34a"/>
                    <ellipse cx="270" cy="225" rx="10" ry="5" fill="#16a34a"/>
                    <ellipse cx="95" cy="218" rx="8" ry="4" fill="#16a34a"/>
                    <ellipse cx="305" cy="218" rx="8" ry="4" fill="#16a34a"/>
                </g>
            </svg>

            <!-- Üzerinde Büyüyen Canlı Mahsuller -->
            <div class="crops-overlay" id="fieldCropsContainer"></div>
        </div>
    </div>

    <div style="background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.8);">
        <div class="compact-date-card" onclick="toggleCalendarDrawer()">
            <div class="date-display-info">
                <span>📅</span>
                <span id="selectedDateText">Ağustos 2026</span>
            </div>
            <span style="font-size: 0.8rem; color: #64748b;" id="drawerArrow">▼ Takvimi Aç</span>
        </div>
        <div class="calendar-drawer" id="calendarDrawer">
            <div style="margin-bottom: 8px; display: flex; justify-content: flex-end;">
                <select id="monthSelect" onchange="changeMonth()" style="padding: 3px 8px; font-size: 0.78rem; border-radius: 6px; border: 1px solid #cbd5e1; background:#f1f5f9;">
                    <option value="0">Ocak</option><option value="1">Şubat</option><option value="2">Mart</option>
                    <option value="3">Nisan</option><option value="4">Mayıs</option><option value="5">Haziran</option>
                    <option value="6">Temmuz</option><option value="7" selected>Ağustos</option><option value="8">Eylül</option>
                    <option value="9">Ekim</option><option value="10">Kasım</option><option value="11">Aralık</option>
                </select>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span id="dailyCardTitle">Günün Amelleri</span>
            <span id="completionRate" style="color: var(--accent-color);">0/6</span>
        </div>
        
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="0" onchange="handleIbadetChange(0, '🌅 Sabah serinliğiyle uçsuz bucaksız tarlaya ilk tohumlar atıldı.')"><div class="ibadet-text-group"><span class="ibadet-name">🌅 Sabah Namazı</span><span class="ibadet-desc">Günün ilk tohumu</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="1" onchange="handleIbadetChange(1, '☀️ Öğle güneşi altında tarlanın sıra sıra filizleri can suyu aldı.')"><div class="ibadet-text-group"><span class="ibadet-name">☀️ Öğle Namazı</span><span class="ibadet-desc">Gündüzün orta yerinde sulama</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="2" onchange="handleIbadetChange(2, '🌤️ İkindi vakti, uçsuz bucaksız yeşil yapraklar coşkuyla büyüdü.')"><div class="ibadet-text-group"><span class="ibadet-name">🌤️ İkindi Namazı</span><span class="ibadet-desc">Ömrün ikindisinde sebat</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="3" onchange="handleIbadetChange(3, '🌇 Akşam huzuruyla tarlada rengarenk çiçekler açtı.')"><div class="ibadet-text-group"><span class="ibadet-name">🌇 Akşam Namazı</span><span class="ibadet-desc">Hüznü geride bırakıp ürüne yöneliş</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="4" onchange="handleIbadetChange(4, '🌙 Yatsı sükunetinde ekinler başak verip olgunlaştı.')"><div class="ibadet-text-group"><span class="ibadet-name">🌙 Yatsı Namazı</span><span class="ibadet-desc">Gece sükunetinde tarlanın koruması</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="5" onchange="handleIbadetCode(5, '✨📿 Zirve Hasat: Zikir bereketiyle tarlan uçsuz bucaksız altın sarısı ürüne kavuştu!')"><div class="ibadet-text-group"><span class="ibadet-name">📿 Günlük Zikir & Dua</span><span class="ibadet-desc">"Sübhanallahi ve bihamdihi" ile bereket</span></div></div></label>
    </div>
</div>

<div class="footer">Ayetin Vakti Ekosistemi • <span>Adım Adım Manevi Hasat</span></div>

<script>
    let currentMonth = new Date().getMonth();
    let selectedDay = new Date().getDate();
    const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    const viewport = document.getElementById('fieldViewport');
    const scene = document.getElementById('fieldScene');

    // Fare hareketine göre tarlada 3D derinlik ve açı efekti
    viewport.addEventListener('mousemove', (e) => {
        const rect = viewport.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        scene.style.transform = `rotateX(${-y / 15}deg) rotateY(${x / 15}deg) scale(1.05)`;
    });

    viewport.addEventListener('mouseleave', () => {
        scene.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
    });

    function toggleCalendarDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const arrow = document.getElementById('drawerArrow');
        drawer.classList.toggle('open');
        arrow.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        const totalDays = monthDays[currentMonth];
        for (let d = 1; d <= totalDays; d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box' + (d === selectedDay ? ' active' : '');
            const key = `manevi_tarla_${currentMonth}_${d}`;
            const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const completedCount = savedData.filter(Boolean).length;
            dayBox.innerHTML = `<span class="day-num">${d}</span><div class="day-dot ${completedCount > 0 ? 'completed' : ''}" style="opacity: ${completedCount > 0 ? 1 : 0.3}"></div>`;
            dayBox.onclick = () => { selectedDay = d; initCalendar(); loadDayData(); };
            grid.appendChild(dayBox);
        }
        loadDayData();
    }

    function changeMonth() {
        currentMonth = parseInt(document.getElementById('monthSelect').value);
        selectedDay = 1;
        initCalendar();
    }

    function loadDayData() {
        const key = `manevi_tarla_${currentMonth}_${selectedDay}`;
        const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = savedData[idx]);
        document.getElementById('selectedDateText').innerText = `${selectedDay} ${monthNames[currentMonth]} 2026`;
        document.getElementById('dailyCardTitle').innerText = `${selectedDay} ${monthNames[currentMonth]} Amelleri`;
        updateFarmCropsVisual(savedData, false);
    }

    function handleIbadetChange(index, quoteText) {
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        let data = Array.from(checkboxes).map(cb => cb.checked);
        document.getElementById('spiritQuote').innerText = checkboxes[index].checked ? quoteText : "Tarlanı büyütmek için ibadetlerini tamamla...";
        localStorage.setItem(`manevi_tarla_${currentMonth}_${selectedDay}`, JSON.stringify(data));
        initCalendar();
        updateFarmCropsVisual(data, true);
    }

    function updateFarmCropsVisual(data, animate = false) {
        const count = data.filter(Boolean).length;
        document.getElementById('completionRate').innerText = `${count}/6`;
        const container = document.getElementById('fieldCropsContainer');
        container.innerHTML = '';
        
        // Tarlanın evreleri
        const farmStages = [
            "🟤", "🌱", "🌿", "☘️", "🌷", "🌾", "🌟🌾"
        ];
        
        let currentVisual = farmStages[count];

        for (let i = 0; i < 4; i++) {
            const item = document.createElement('div');
            item.className = 'crop-row-item' + (animate ? ' pop-animation' : '');
            
            if (count === 6) {
                item.style.transform = 'scale(1.4) translateY(-8px)';
                item.style.filter = 'drop-shadow(0 0 12px rgba(234, 179, 8, 0.9))';
            } else if (count > 0) {
                item.style.transform = `scale(${0.9 + (count * 0.08)})`;
            }
            
            item.innerText = currentVisual;
            container.appendChild(item);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('monthSelect').value = currentMonth;
        initCalendar();
    });
</script>
</body>
</html>
