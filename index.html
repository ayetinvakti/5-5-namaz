<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manevi Tarım & İbadet Takvimi | Ayetin Vakti</title>
    <meta name="theme-color" content="#10b981">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
            
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }
        })();
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #fef08a 0%, #d9f99d 50%, #93c5fd 100%);
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 14px; 
            transition: 0.3s; 
        }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; }
        
        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
        .back-btn { background: none; border: none; color: #1e293b; font-size: 1.5rem; cursor: pointer; text-decoration: none; font-weight: bold; }
        .app-title { font-size: 0.95rem; font-weight: 700; color: #1e293b; font-family: 'Georgia', serif; text-align: center; }

        #spiritQuote { 
            min-height: 36px; 
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: -4px; 
            font-style: italic; 
            font-size: 0.8rem; 
            color: #065f46; 
            text-align: center; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.4s; 
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .island-viewport {
            width: 100%;
            height: 270px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            animation: floatClouds 12s infinite alternate ease-in-out;
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); border-radius: 50%; }
        .c1 { width: 90px; height: 32px; top: 15px; left: 15px; }
        .c1::before { width: 45px; height: 45px; top: -22px; left: 12px; }
        .c1::after { width: 35px; height: 35px; top: -15px; left: 45px; }

        .c2 { width: 110px; height: 38px; top: 10px; right: 20px; animation-delay: 1s; }
        .c2::before { width: 55px; height: 55px; top: -28px; left: 15px; }
        .c2::after { width: 40px; height: 40px; top: -18px; left: 55px; }

        @keyframes floatClouds {
            0% { transform: translateX(-12px); }
            100% { transform: translateX(12px); }
        }

        .floating-island {
            width: 280px;
            height: 190px;
            position: relative;
            animation: floatIsland 4s infinite ease-in-out;
        }

        @keyframes floatIsland {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .island-svg { width: 100%; height: 100%; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3)); }

        .field-crops-container {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 5;
        }

        .farm-crop-item {
            font-size: 1.5rem;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
        }

        .compact-date-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .date-display-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; color: #1e293b; }
        
        .calendar-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 0 0 14px 14px;
            padding: 0 14px;
        }
        .calendar-drawer.open { max-height: 180px; padding: 10px 14px 14px 14px; border-top: 1px solid #e2e8f0; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-height: 120px; overflow-y: auto; }
        .day-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 2px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .day-box.active { border-color: #eab308; background: #fffbeb; box-shadow: 0 0 5px rgba(234, 179, 8, 0.4); }
        .day-num { font-size: 0.7rem; font-weight: 700; color: #334155; }
        .day-dot { width: 4px; height: 4px; border-radius: 50%; background: #cbd5e1; }
        .day-dot.completed { background: #10b981; }

        .card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-radius: 16px; 
            padding: 12px 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }
        .section-title { font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }

        .ibadet-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.2s; user-select: none; }
        .ibadet-item:hover { border-color: var(--accent-color); }
        .ibadet-info { display: flex; align-items: center; gap: 10px; width: 100%; }
        .ibadet-checkbox { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }
        .ibadet-text-group { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .ibadet-name { font-weight: 600; font-size: 0.88rem; color: #1e293b; }
        .ibadet-desc { font-size: 0.72rem; color: #64748b; font-weight: 500; }

        .footer { margin: 2px 0 10px 0; text-align: center; font-size: 0.72rem; color: #475569; }
        .footer span { color: #047857; font-weight: 700; }

        body.light-mode { --bg-gradient: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="http://ayetinvakti.github.io" class="back-btn">‹</a>
        <span class="app-title">🌱 Manevi Tarım & İbadet</span>
        <div style="width: 24px;"></div>
    </header>

    <div id="spiritQuote">"Bismillah de, tarlanı ekmeye başla..."</div>

    <div class="island-viewport">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <div class="floating-island">
            <!-- Gönderdiğiniz Resimdeki 3D / İzometrik Tarla Düzeni Tasarımı -->
            <svg class="island-svg" viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="groundSoil" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#5c3818"/>
                        <stop offset="100%" stop-color="#2a170a"/>
                    </linearGradient>
                    <linearGradient id="sideWall" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#201007"/>
                        <stop offset="100%" stop-color="#3d2110"/>
                    </linearGradient>
                </defs>

                <!-- Ön Taş / Beton Sınır Duvarı (Resimdeki alt zemin havuz duvarı efekti) -->
                <path d="M25,145 L235,145 L235,165 L25,165 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
                <line x1="60" y1="145" x2="60" y2="165" stroke="#64748b" stroke-width="1"/>
                <line x1="95" y1="145" x2="95" y2="165" stroke="#64748b" stroke-width="1"/>
                <line x1="130" y1="145" x2="130" y2="165" stroke="#64748b" stroke-width="1"/>
                <line x1="165" y1="145" x2="165" y2="165" stroke="#64748b" stroke-width="1"/>
                <line x1="200" y1="145" x2="200" y2="165" stroke="#64748b" stroke-width="1"/>

                <!-- 3D İzometrik Tarla Ana Platform Gövdesi -->
                <path d="M30,70 L230,70 L245,135 L15,135 Z" fill="url(#groundSoil)" stroke="#1a0d05" stroke-width="2"/>
                
                <!-- Sol ve Sağ Blok Yan Derinlikleri -->
                <path d="M15,135 L45,150 L45,85 L30,70 Z" fill="url(#sideWall)"/>
                <path d="M235,135 L205,150 L205,85 L230,70 Z" fill="#4a2814"/>

                <!-- Resimdeki Gibi Bölümlenmiş Tarla Yüzeyleri (Bloklar) -->
                <!-- Sol Yan Tarla Bloğu -->
                <rect x="35" y="78" width="55" height="48" fill="#4a3018" rx="3" stroke="#2c1a0c"/>
                <!-- Orta Dikey Hasat / Mahsul Yolu (Sizin Emojilerin Oturduğu Yer) -->
                <rect x="98" y="76" width="64" height="52" fill="#36220f" rx="3" stroke="#211306"/>
                <!-- Sağ Yan Tarla Bloğu -->
                <rect x="170" y="78" width="55" height="48" fill="#4a3018" rx="3" stroke="#2c1a0c"/>

                <!-- Ortadaki Tarlanın Sürülmüş Çizgileri (Karıklar) -->
                <line x1="108" y1="84" x2="152" y2="84" stroke="#4d3319" stroke-width="2"/>
                <line x1="108" y1="94" x2="152" y2="94" stroke="#4d3319" stroke-width="2"/>
                <line x1="108" y1="104" x2="152" y2="104" stroke="#4d3319" stroke-width="2"/>
                <line x1="108" y1="114" x2="152" y2="114" stroke="#4d3319" stroke-width="2"/>

                <!-- Sol ve Sağ Bloklardaki Sembolik Ağaç Gövdeleri / Yeşillikler -->
                <circle cx="62" cy="102" r="14" fill="#166534" opacity="0.85"/>
                <circle cx="62" cy="98" r="10" fill="#22c55e" opacity="0.7"/>
                <circle cx="198" cy="102" r="14" fill="#14532d" opacity="0.85"/>
                <circle cx="198" cy="98" r="10" fill="#16a34a" opacity="0.7"/>
            </svg>
            <div class="field-crops-container" id="fieldCropsContainer"></div>
        </div>
    </div>

    <div style="background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.6);">
        <div class="compact-date-card" onclick="toggleCalendarDrawer()">
            <div class="date-display-info">
                <span>📅</span>
                <span id="selectedDateText">Ağustos 2026</span>
            </div>
            <span style="font-size: 0.8rem; color: #64748b;" id="drawerArrow">▼ Takvimi Aç</span>
        </div>
        <div class="calendar-drawer" id="calendarDrawer">
            <div style="margin-bottom: 8px; display: flex; justify-content: flex-end;">
                <select id="monthSelect" onchange="changeMonth()" style="padding: 3px 8px; font-size: 0.78rem; border-radius: 6px; border: 1px solid #cbd5e1; background:#f1f5f9;">
                    <option value="0">Ocak</option><option value="1">Şubat</option><option value="2">Mart</option>
                    <option value="3">Nisan</option><option value="4">Mayıs</option><option value="5">Haziran</option>
                    <option value="6">Temmuz</option><option value="7" selected>Ağustos</option><option value="8">Eylül</option>
                    <option value="9">Ekim</option><option value="10">Kasım</option><option value="11">Aralık</option>
                </select>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span id="dailyCardTitle">Günün Amelleri</span>
            <span id="completionRate" style="color: var(--accent-color);">0/6</span>
        </div>
        
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="0" onchange="handleIbadetChange(0, '🌅 Sabahın bereketi üzerine olsun, tohum düştü.')"><div class="ibadet-text-group"><span class="ibadet-name">🌅 Sabah Namazı</span><span class="ibadet-desc">Günün ilk tohumu</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="1" onchange="handleIbadetChange(1, '☀️ Öğle vaktinde tarlan suyla doldu.')"><div class="ibadet-text-group"><span class="ibadet-name">☀️ Öğle Namazı</span><span class="ibadet-desc">Gündüzün orta yerinde sulama</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="2" onchange="handleIbadetChange(2, '🌤️ İkindi vakti, amellerin kıymet vaktidir.')"><div class="ibadet-text-group"><span class="ibadet-name">🌤️ İkindi Namazı</span><span class="ibadet-desc">Ömrün ikindisinde sebat</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="3" onchange="handleIbadetChange(3, '🌇 Akşam, günün hasadına yaklaşılan vaktidir.')"><div class="ibadet-text-group"><span class="ibadet-name">🌇 Akşam Namazı</span><span class="ibadet-desc">Hüznü geride bırakıp ürüne yöneliş</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="4" onchange="handleIbadetChange(4, '🌙 Yatsı, gece sükunetinde tarlanın korumasıdır.')"><div class="ibadet-text-group"><span class="ibadet-name">🌙 Yatsı Namazı</span><span class="ibadet-desc">Gece sükunetinde tarlanın koruması</span></div></div></label>
        <label class="ibadet-item"><div class="ibadet-info"><input type="checkbox" class="ibadet-checkbox" data-index="5" onchange="handleIbadetChange(5, '✨📿 Zirve Evre: Zikirle tarlan yeşerdi!')"><div class="ibadet-text-group"><span class="ibadet-name">📿 Günlük Zikir & Dua</span><span class="ibadet-desc">"Sübhanallahi ve bihamdihi" ile bereket</span></div></div></label>
    </div>
</div>

<div class="footer">Ayetin Vakti Ekosistemi • <span>Adım Adım Manevi Hasat</span></div>

<script>
    let currentMonth = new Date().getMonth();
    let selectedDay = new Date().getDate();
    const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    function toggleCalendarDrawer() {
        const drawer = document.getElementById('calendarDrawer');
        const arrow = document.getElementById('drawerArrow');
        drawer.classList.toggle('open');
        arrow.innerText = drawer.classList.contains('open') ? "▲ Kapat" : "▼ Takvimi Aç";
    }

    function initCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        const totalDays = monthDays[currentMonth];
        for (let d = 1; d <= totalDays; d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box' + (d === selectedDay ? ' active' : '');
            const key = `manevi_tarla_${currentMonth}_${d}`;
            const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
            const completedCount = savedData.filter(Boolean).length;
            dayBox.innerHTML = `<span class="day-num">${d}</span><div class="day-dot ${completedCount > 0 ? 'completed' : ''}" style="opacity: ${completedCount > 0 ? 1 : 0.3}"></div>`;
            dayBox.onclick = () => { selectedDay = d; initCalendar(); loadDayData(); };
            grid.appendChild(dayBox);
        }
        loadDayData();
    }

    function changeMonth() {
        currentMonth = parseInt(document.getElementById('monthSelect').value);
        selectedDay = 1;
        initCalendar();
    }

    function loadDayData() {
        const key = `manevi_tarla_${currentMonth}_${selectedDay}`;
        const savedData = JSON.parse(localStorage.getItem(key)) || [false, false, false, false, false, false];
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        checkboxes.forEach((cb, idx) => cb.checked = savedData[idx]);
        document.getElementById('selectedDateText').innerText = `${selectedDay} ${monthNames[currentMonth]} 2026`;
        document.getElementById('dailyCardTitle').innerText = `${selectedDay} ${monthNames[currentMonth]} Amelleri`;
        updateFarmCropsVisual(savedData);
    }

    function handleIbadetChange(index, quoteText) {
        const checkboxes = document.querySelectorAll('.ibadet-checkbox');
        let data = Array.from(checkboxes).map(cb => cb.checked);
        document.getElementById('spiritQuote').innerText = checkboxes[index].checked ? quoteText : "Tarlanı büyütmek için ibadetlerini tamamla...";
        localStorage.setItem(`manevi_tarla_${currentMonth}_${selectedDay}`, JSON.stringify(data));
        initCalendar();
        updateFarmCropsVisual(data);
    }

    function updateFarmCropsVisual(data) {
        const count = data.filter(Boolean).length;
        document.getElementById('completionRate').innerText = `${count}/6`;
        const container = document.getElementById('fieldCropsContainer');
        container.innerHTML = '';
        
        const stages = ["🟤", "🌱", "🌿", "🎋", "🌾", "🌾", "✨🌾"];
        let currentEmoji = stages[count]; 

        for (let i = 0; i < 3; i++) {
            container.innerHTML += `<div class="farm-crop-item" style="${count === 6 ? 'transform: scale(1.35) translateY(-4px); filter: drop-shadow(0 0 12px rgba(234, 179, 8, 0.8));' : ''}">${currentEmoji}</div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('monthSelect').value = currentMonth;
        initCalendar();
    });
</script>
</body>
</html>
